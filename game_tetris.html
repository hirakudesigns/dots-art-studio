<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOTS BLAST 3D - Special Edition</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --bg-color: #1a1a2e;
            --card-bg: #161625;
            --accent-color: #ff7675;
            --text-color: #ffffff;
            --panel-bg: #222546;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; user-select: none; -webkit-user-select: none; touch-action: none;
        }
        .header { text-align: center; margin-bottom: 2px; }
        h1 { font-size: 1.1rem; margin: 0; color: #00f5d4; font-weight: 900; letter-spacing: 1px; }
        
        .stats-row { display: flex; gap: 10px; margin: 4px 0; }
        .stat-box {
            font-size: 0.8rem; font-weight: bold; background: var(--card-bg);
            padding: 4px 12px; border-radius: 15px; border: 2px solid #333;
        }
        
        #gameContainer {
            position: relative; width: 100%; max-width: 320px;
            aspect-ratio: 32 / 40; background: #05050a;
            border: 4px solid #333; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); overflow: hidden;
        }
        #threeCanvasContainer { width: 100%; height: 100%; }

        /* 🕹️ レトロゲーム機風 コントローラーレイアウト */
        .retro-controller {
            width: 100%; max-width: 320px; margin-top: 12px;
            background: var(--panel-bg); border-radius: 20px;
            padding: 15px 10px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: inset 0 4px 0 rgba(255,255,255,0.1), 0 6px 12px rgba(0,0,0,0.4);
            border: 2px solid #111;
        }

        /* 左手側：十字キー（左右） */
        .d-pad { display: flex; gap: 8px; align-items: center; }
        .d-btn {
            width: 54px; height: 50px; background: #2f3542;
            border: none; border-radius: 10px; color: white;
            box-shadow: 0 4px 0 #1e222b; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .d-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1e222b; background: var(--primary-color); }

        /*右手側：A/Bアクションボタン */
        .action-pad { display: flex; gap: 12px; position: relative; top: -5px; }
        .a-btn {
            width: 56px; height: 56px; border: none; border-radius: 50%;
            color: white; font-weight: bold; font-size: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 5px 0 #571717;
        }
        /* Bボタン風（落とす・空中起爆） */
        .btn-blue { background: #ff4757; box-shadow: 0 5px 0 #b3323c; }
        .btn-blue:active { transform: translateY(4px); box-shadow: 0 1px 0 #b3323c; }
        /* Aボタン風（回転） */
        .btn-green { background: #2ed573; box-shadow: 0 5px 0 #219653; }
        .btn-green:active { transform: translateY(4px); box-shadow: 0 1px 0 #219653; }
        .a-btn .material-icons { font-size: 18px; margin-bottom: 2px; }

        #gameOverOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .game-over-title { color: var(--accent-color); font-size: 1.8rem; font-weight: 900; margin-bottom: 10px; }
        .btn-restart { padding: 10px 20px; background: var(--primary-color); border: none; color: white; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>DOTS BLAST 3D</h1>
        <div class="stats-row">
            <div class="stat-box">SCORE: <span id="scoreVal">0</span></div>
            <div class="stat-box" id="gaugeBox">NEXT BOMB: <span id="gaugeVal">0</span>/50</div>
        </div>
    </div>

    <div id="gameContainer">
        <div id="threeCanvasContainer"></div>
        <div id="gameOverOverlay">
            <div class="game-over-title">GAME OVER</div>
            <p id="finalScore" style="margin-bottom: 20px;"></p>
            <button class="btn-restart" onclick="resetGame()">RETRY</button>
        </div>
    </div>

    <div class="retro-controller">
        <div class="d-pad">
            <button class="d-btn" onclick="movePiece(-1,0)"><span class="material-icons">arrow_back</span></button>
            <button class="d-btn" onclick="movePiece(1,0)"><span class="material-icons">arrow_forward</span></button>
        </div>
        
        <div class="action-pad">
            <button class="a-btn btn-blue" onclick="handleActionB()">
                <span class="material-icons" id="actionBIcon">vertical_align_bottom</span>
                <span id="actionBText">落とす</span>
            </button>
            <button class="a-btn btn-green" onclick="movePiece(0,0,true)">
                <span class="material-icons">rotate_right</span>
                <span>回転</span>
            </button>
        </div>
    </div>

    <script>
        const COLS = 32;
        const ROWS = 40;

        let scene, camera, renderer;
        let grid = []; 
        let meshes = []; 
        let score = 0;
        let deletedCount = 0; // 累計消去数カウンター
        let isGameOver = false;

        // 通常パーツ（紫）
        const SHAPES = [
            [[1,1,1,1]], // I
            [[1,1,1],[0,1,0]], // T
            [[1,1,1],[1,0,0]], // L
            [[1,1],[1,1]], // O
            [[1,1,0],[0,1,1]]  // Z
        ];
        
        const COLOR_NORMAL_PIECE = "#6c5ce7"; // 通常パーツ（紫）
        const COLOR_SUPER_BOMB   = "#222222"; // 50個消去のスーパー爆弾（黒）
        const COLOR_AIR_BOMB     = "#ff4757"; // 10%で降る空中起爆パーツ（赤）

        let currentPiece = { shape: [], x: 0, y: 0, type: 'normal', color: COLOR_NORMAL_PIECE };
        let dropInterval;
        let particles = []; // 爆破エフェクト用オブジェクトの配列

        window.addEventListener('DOMContentLoaded', () => {
            initGame();
            initThree();
            animate();
            spawnPiece();
            startTimer();
        });

        function initGame() {
            score = 0;
            deletedCount = 0;
            isGameOver = false;
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('gaugeVal').innerText = "0";
            document.getElementById('gameOverOverlay').style.display = 'none';

            grid = [];
            for (let y = 0; y < ROWS; y++) {
                grid[y] = new Array(COLS).fill(null);
            }

            // テスト用：下部に自動でカラフルなドット絵を生成
            for (let y = 18; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let dist = Math.abs(x - 16);
                    if (ROWS - y > dist - 3) {
                        const colors = ["#ff7675", "#74b9ff", "#a29bfe", "#ffeaa7", "#55efc4"];
                        grid[y][x] = colors[Math.floor(Math.sin(x*y)*5 + 5) % colors.length];
                    }
                }
            }
        }

        function initThree() {
            const container = document.getElementById('threeCanvasContainer');
            const rect = container.getBoundingClientRect();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a14);

            camera = new THREE.PerspectiveCamera(60, rect.width / rect.height, 0.1, 1000);
            camera.position.set(COLS / 2, -ROWS / 2, 33); 
            camera.lookAt(COLS / 2, -ROWS / 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(rect.width, rect.height);
            container.innerHTML = ""; 
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.75));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.3);
            dirLight.position.set(10, 20, 20);
            scene.add(dirLight);

            drawFullGrid3D();
        }

        function drawFullGrid3D() {
            meshes.forEach(m => { if(m) scene.remove(m); });
            meshes = [];

            const geo = new THREE.BoxGeometry(0.92, 0.92, 0.92); 

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (grid[y][x]) {
                        const mat = new THREE.MeshStandardMaterial({
                            color: new THREE.Color(grid[y][x]), roughness: 0.3
                        });
                        const mesh = new THREE.Mesh(geo, mat);
                        mesh.position.set(x + 0.5, -y - 0.5, 0);
                        scene.add(mesh);
                        meshes.push(mesh);
                    }
                }
            }
        }

        function spawnPiece() {
            // UIテキストの初期化
            document.getElementById('actionBIcon').innerText = "vertical_align_bottom";
            document.getElementById('actionBText').innerText = "落とす";

            // 1. 50個消去ボーナスがたまっている場合：黒い1マスパーツ
            if (deletedCount >= 50) {
                deletedCount -= 50;
                document.getElementById('gaugeVal').innerText = deletedCount;
                
                currentPiece.shape = [[1]]; // 1マス
                currentPiece.type = 'super';
                currentPiece.color = COLOR_SUPER_BOMB;
            } 
            // 2. 確率10%：赤い空中起爆パーツ（4マスO型固定）
            else if (Math.random() < 0.10) {
                currentPiece.shape = [[1,1],[1,1]]; // O型
                currentPiece.type = 'air';
                currentPiece.color = COLOR_AIR_BOMB;
                
                // ボタン表示を「起爆」に変更
                document.getElementById('actionBIcon').innerText = "brightness_low";
                document.getElementById('actionBText').innerText = "空中起爆";
            } 
            // 3. 通常パーツ（紫）
            else {
                const randIdx = Math.floor(Math.random() * SHAPES.length);
                currentPiece.shape = SHAPES[randIdx];
                currentPiece.type = 'normal';
                currentPiece.color = COLOR_NORMAL_PIECE;
            }

            currentPiece.x = Math.floor(COLS / 2) - Math.floor(currentPiece.shape[0].length / 2);
            currentPiece.y = 0;

            if (checkCollision(currentPiece.x, currentPiece.y, currentPiece.shape)) {
                endGame();
            }
            updateActivePieceVisual();
        }

        function checkCollision(nextX, nextY, shape) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        let targetX = nextX + c;
                        let targetY = nextY + r;
                        if (targetX < 0 || targetX >= COLS || targetY >= ROWS) return true;
                        if (targetY >= 0 && grid[targetY][targetX]) return true; 
                    }
                }
            }
            return false;
        }

        let activeMeshes = [];
        function updateActivePieceVisual() {
            activeMeshes.forEach(m => scene.remove(m));
            activeMeshes = [];

            const geo = new THREE.BoxGeometry(0.92, 0.92, 0.92);
            const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(currentPiece.color), roughness: 0.2 });

            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        const mesh = new THREE.Mesh(geo, mat);
                        mesh.position.set(currentPiece.x + c + 0.5, -(currentPiece.y + r) - 0.5, 0);
                        scene.add(mesh);
                        activeMeshes.push(mesh);
                    }
                }
            }
        }

        function movePiece(dx, dy, rotate = false) {
            if (isGameOver) return;
            let nextX = currentPiece.x + dx;
            let nextY = currentPiece.y + dy;
            let nextShape = currentPiece.shape;

            if (rotate && currentPiece.type !== 'super') { // 1マスパーツは回転不要
                nextShape = currentPiece.shape[0].map((val, index) => 
                    currentPiece.shape.map(row => row[index]).reverse()
                );
            }

            if (!checkCollision(nextX, nextY, nextShape)) {
                currentPiece.x = nextX;
                currentPiece.y = nextY;
                currentPiece.shape = nextShape;
                updateActivePieceVisual();
            } else if (dy > 0) {
                lockPiece();
            }
        }

        // Bアクションボタンが押された時の処理の振り分け
        function handleActionB() {
            if (currentPiece.type === 'air') {
                // 赤いパーツは「その場で空中起爆」
                triggerExplosion(currentPiece.x + 1, currentPiece.y + 1, 4, true);
            } else {
                // 通常時・黒パーツ時は「一気に落とす」
                while (!checkCollision(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) {
                    currentPiece.y++;
                }
                lockPiece();
            }
        }

        function lockPiece() {
            // 1. 盤面への固定
            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        let targetY = currentPiece.y + r;
                        let targetX = currentPiece.x + c;
                        if (targetY >= 0) {
                            grid[targetY][targetX] = currentPiece.color;
                        }
                    }
                }
            }

            // 2. タイプに応じた爆破半径・ターゲットの設定
            let radius = 2; // 通常は周囲5x5（半径2）
            let includeNormalPieces = false;

            if (currentPiece.type === 'super') {
                radius = 4; // 黒いスーパー爆弾は広範囲（9x9）
                includeNormalPieces = true; // 紫のパーツ同士もすべて消去可能！
            }

            // 中心点を割り出して爆破実行
            let centerY = currentPiece.y + Math.floor(currentPiece.shape.length / 2);
            let centerX = currentPiece.x + Math.floor(currentPiece.shape[0].length / 2);
            triggerExplosion(centerX, centerY, radius, includeNormalPieces);
        }

        // 💥 爆破処理コアシステム
        function triggerExplosion(centerX, centerY, radius, includeNormalPieces) {
            let explodedCount = 0;

            for (let ey = centerY - radius; ey <= centerY + radius; ey++) {
                for (let ex = centerX - radius; ex <= centerX + radius; ex++) {
                    if (ey >= 0 && ey < ROWS && ex >= 0 && ex < COLS) {
                        if (grid[ey][ex]) {
                            // 通常パーツ(紫)を消せるかどうかの判定
                            if (grid[ey][ex] === COLOR_NORMAL_PIECE && !includeNormalPieces) {
                                continue; 
                            }

                            // 💥 四方に飛び散る3Dパーティクルを生成！
                            createExplosionParticles(ex + 0.5, -ey - 0.5, grid[ey][ex]);

                            grid[ey][ex] = null; // 盤面から消去
                            explodedCount++;
                        }
                    }
                }
            }

            // スコアとゲージの計算
            if (explodedCount > 0) {
                score += explodedCount * 10;
                deletedCount = Math.min(50, deletedCount + explodedCount); // 最大50までチャージ
                
                document.getElementById('scoreVal').innerText = score;
                document.getElementById('gaugeVal').innerText = deletedCount;
            }

            drawFullGrid3D();
            spawnPiece();
        }

        // ✨ 3D弾ける爆破エフェクトの生成
        function createExplosionParticles(x, y, colorStr) {
            const particleGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const particleMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(colorStr) });

            // 1個のブロックにつき5個の飛び散る破片を生成
            for (let i = 0; i < 5; i++) {
                const p = new THREE.Mesh(particleGeo, particleMat);
                p.position.set(x, y, 0);
                
                // 初速度をランダムに設定（四方八方＆手前奥にも少し）
                p.userData = {
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4 + 0.2, // 少し上に噴き上がる
                    vz: (Math.random() - 0.5) * 0.2,
                    life: 1.0 // 寿命
                };
                
                scene.add(p);
                particles.push(p);
            }
        }

        // パーティクルの毎フレーム位置・寿命更新
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.x += p.userData.vx;
                p.position.y += p.userData.vy;
                p.position.z += p.userData.vz;
                
                // 重力の影響で少しずつ下に落ちる
                p.userData.vy -= 0.015;
                
                // フェードアウト（縮小）
                p.userData.life -= 0.04;
                p.scale.set(p.userData.life, p.userData.life, p.userData.life);

                if (p.userData.life <= 0) {
                    scene.remove(p);
                    p.geometry.dispose();
                    p.material.dispose();
                    particles.splice(i, 1);
                }
            }
        }

        function startTimer() {
            if (dropInterval) clearInterval(dropInterval);
            dropInterval = setInterval(() => {
                movePiece(0, 1);
            }, 800);
        }

        function endGame() {
            isGameOver = true;
            clearInterval(dropInterval);
            document.getElementById('finalScore').innerText = `獲得スコア: ${score} 点`;
            document.getElementById('gameOverOverlay').style.display = 'flex';
        }

        function resetGame() {
            initGame();
            drawFullGrid3D();
            spawnPiece();
            startTimer();
        }

        function animate() {
            requestAnimationFrame(animate);
            updateParticles(); // エフェクトの更新
            renderer.render(scene, camera);
        }

        // PCキーボード用（テストプレイがしやすいようにバインド）
        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            switch(e.key) {
                case 'ArrowLeft':  movePiece(-1, 0); break;
                case 'ArrowRight': movePiece(1, 0); break;
                case 'ArrowDown':  movePiece(0, 1); break;
                case 'ArrowUp':    movePiece(0, 0, true); break; 
                case ' ':          handleActionB(); break; 
            }
        });
    </script>
</body>
</html>
