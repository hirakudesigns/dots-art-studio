<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOTS BLAST 3D - 特典パズルゲーム</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #ff7675;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .header {
            text-align: center;
            margin-bottom: 5px;
        }
        h1 { font-size: 1.2rem; margin: 0; color: #55efc4; font-weight: 900; letter-spacing: 1px; }
        .score-container {
            font-size: 1rem;
            font-weight: bold;
            background: var(--card-bg);
            padding: 5px 15px;
            border-radius: 20px;
            margin: 5px 0;
            border: 2px solid #444;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 32 / 40; /* 横32マス、縦40マスの比率 */
            background: #000;
            border: 4px solid var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        #threeCanvasContainer {
            width: 100%;
            height: 100%;
        }
        /* スマホ用操作コントローラー */
        .controls {
            width: 100%;
            max-width: 340px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .control-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn {
            flex: 1;
            height: 50px;
            background: var(--card-bg);
            border: 2px solid #444;
            color: #fff;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: background 0.1s;
        }
        .btn:active {
            background: var(--primary-color);
        }
        .btn-rotate {
            background: #4b6584;
        }
        #gameOverOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .game-over-title {
            color: var(--accent-color);
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .btn-restart {
            padding: 10px 20px;
            background: var(--primary-color);
            border: none;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>DOTS BLAST 3D</h1>
        <div class="score-container">SCORE: <span id="scoreVal">0</span></div>
    </div>

    <div id="gameContainer">
        <div id="threeCanvasContainer"></div>
        <div id="gameOverOverlay">
            <div class="game-over-title">GAME OVER</div>
            <p id="finalScore" style="margin-bottom: 20px;"></p>
            <button class="btn-restart" onclick="resetGame()">もう一度遊ぶ</button>
        </div>
    </div>

    <div class="controls">
        <div class="control-row">
            <button class="btn btn-rotate" onclick="movePiece(0,0,true)"><span class="material-icons">rotate_right</span>回転</button>
        </div>
        <div class="control-row">
            <button class="btn" onclick="movePiece(-1,0)"><span class="material-icons">arrow_back</span>左</button>
            <button class="btn" onclick="movePiece(0,1)"><span class="material-icons">arrow_downward</span>下</button>
            <button class="btn" onclick="movePiece(1,0)"><span class="material-icons">arrow_forward</span>右</button>
        </div>
        <div class="control-row">
            <button class="btn" onclick="dropInstant()" style="background: #20bf6b;"><span class="material-icons">vertical_align_bottom</span>一気に落とす</button>
        </div>
    </div>

    <script>
        // ゲーム盤面サイズ：横32マス、縦40マス（下部32マス分に作品が最初から配置される）
        const COLS = 32;
        const ROWS = 40;
        const BLOCK_SIZE = 1;

        let scene, camera, renderer;
        let grid = []; // 盤面の状態（色のHEX文字列、空はnull）
        let meshes = []; // 盤面の3Dメッシュを管理する二次元配列
        let score = 0;
        let isGameOver = false;

        // 落下するテトリスパーツ（ミノ）の定義
        const SHAPES = [
            [[1,1,1,1]], // I
            [[1,1,1],[0,1,0]], // T
            [[1,1,1],[1,0,0]], // L
            [[1,1],[1,1]], // O
            [[1,1,0],[0,1,1]]  // Z
        ];
        const PIECE_COLOR = "#6c5ce7"; // 落下パーツの色

        let currentPiece = {
            shape: [],
            x: 0,
            y: 0
        };

        let dropInterval;

        window.addEventListener('DOMContentLoaded', () => {
            initGame();
            initThree();
            animate();
            spawnPiece();
            startTimer();
        });

        // 1. 盤面配列の初期化とドット絵の読み込み
        function initGame() {
            score = 0;
            isGameOver = false;
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('gameOverOverlay').style.display = 'none';

            // 空の盤面（40行×32列）を作成
            grid = [];
            for (let y = 0; y < ROWS; y++) {
                grid[y] = new Array(COLS).fill(null);
            }

            // ローカルストレージから直近のドット絵（32x32）の復元を試みる
            // ※本来は matrix データを直接引き渡すか、隠しキャンバスに一度描画して解析します。
            // ここでは簡易的に、下部（y: 8〜39行目）に作品を配置します。
            
            // テスト用：データがない場合は、真ん中に山のようなダミーアートを配置（イレギュラーな形）
            for (let y = 15; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    // 中心に近いほど高くなるような擬似的なドット絵アート
                    let distFromCenter = Math.abs(x - 16);
                    if (ROWS - y > distFromCenter - 4) {
                        // ランダムでカラフルなドット（DOTSをイメージ）
                        const colors = ["#ff7675", "#74b9ff", "#a29bfe", "#ffeaa7", "#55efc4"];
                        grid[y][x] = colors[Math.floor(Math.sin(x*y)*5 + 5) % colors.length];
                    }
                }
            }
        }

        // 2. Three.js による3D空間のセットアップ
        function initThree() {
            const container = document.getElementById('threeCanvasContainer');
            const rect = container.getBoundingClientRect();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            // カメラ配置：盤面全体（横32×縦40）が綺麗に収まるように調整
            camera = new THREE.PerspectiveCamera(60, rect.width / rect.height, 0.1, 1000);
            camera.position.set(COLS / 2, -ROWS / 2, 32); // 正面から見据える位置
            camera.lookAt(COLS / 2, -ROWS / 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(rect.width, rect.height);
            container.appendChild(renderer.domElement);

            // 照明
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight.position.set(10, 20, 20);
            scene.add(dirLight);

            // 初期の盤面ブロック（作品）の3D化
            drawFullGrid3D();
        }

        // 盤面全体をスキャンして3Dブロックを再配置する
        function drawFullGrid3D() {
            // 既存のメッシュをすべて削除
            meshes.forEach(m => { if(m) scene.remove(m); });
            meshes = [];

            const geo = new THREE.BoxGeometry(0.95, 0.95, 0.95); // 隙間を少しあけてドット感を強調

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (grid[y][x]) {
                        const mat = new THREE.MeshStandardMaterial({
                            color: new THREE.Color(grid[y][x]),
                            roughness: 0.3
                        });
                        const mesh = new THREE.Mesh(geo, mat);
                        // Three.jsの座標系（Xは右方向正、Yは上方向正なのでマイナスにする）
                        mesh.position.set(x + 0.5, -y - 0.5, 0);
                        scene.add(mesh);
                        meshes.push(mesh);
                    }
                }
            }
        }

        // 3. パズルゲームのコアロジック
        function spawnPiece() {
            const randIdx = Math.floor(Math.random() * SHAPES.length);
            currentPiece.shape = SHAPES[randIdx];
            currentPiece.x = Math.floor(COLS / 2) - Math.floor(currentPiece.shape[0].length / 2);
            currentPiece.y = 0; // 最上部からスタート

            if (checkCollision(currentPiece.x, currentPiece.y, currentPiece.shape)) {
                // 出現直後に衝突＝ゲームオーバー
                endGame();
            }
            updateActivePieceVisual();
        }

        // 衝突判定（壁・床、および固定済みブロックとの判定）
        function checkCollision(nextX, nextY, shape) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        let targetX = nextX + c;
                        let targetY = nextY + r;

                        if (targetX < 0 || targetX >= COLS || targetY >= ROWS) {
                            return true;
                        }
                        if (targetY >= 0 && grid[targetY][targetX]) {
                            return true; // 既存のブロック（作品含む）に衝突
                        }
                    }
                }
            }
            return false;
        }

        // 現在落下中のパーツの一時表示用3Dオブジェクト
        let activeMeshes = [];
        function updateActivePieceVisual() {
            activeMeshes.forEach(m => scene.remove(m));
            activeMeshes = [];

            const geo = new THREE.BoxGeometry(0.95, 0.95, 0.95);
            const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(PIECE_COLOR), roughness: 0.2 });

            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        const mesh = new THREE.Mesh(geo, mat);
                        mesh.position.set(currentPiece.x + c + 0.5, -(currentPiece.y + r) - 0.5, 0);
                        scene.add(mesh);
                        activeMeshes.push(mesh);
                    }
                }
            }
        }

        // パーツの移動・回転制御
        function movePiece(dx, dy, rotate = false) {
            if (isGameOver) return;
            
            let nextX = currentPiece.x + dx;
            let nextY = currentPiece.y + dy;
            let nextShape = currentPiece.shape;

            if (rotate) {
                // 行列の回転（時計回り）
                nextShape = currentPiece.shape[0].map((val, index) => 
                    currentPiece.shape.map(row => row[index]).reverse()
                );
            }

            if (!checkCollision(nextX, nextY, nextShape)) {
                currentPiece.x = nextX;
                currentPiece.y = nextY;
                currentPiece.shape = nextShape;
                updateActivePieceVisual();
            } else if (dy > 0) {
                // 下に移動しようとして衝突した場合は「着地固定」
                lockPiece();
            }
        }

        function dropInstant() {
            while (!checkCollision(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) {
                currentPiece.y++;
            }
            lockPiece();
        }

        // 🌟 【重要】着地時の爆破消去ロジック（おすすめルール）
        function lockPiece() {
            // 1. パーツを盤面配列に固定
            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        let targetY = currentPiece.y + r;
                        let targetX = currentPiece.x + c;
                        if (targetY >= 0) {
                            grid[targetY][targetX] = PIECE_COLOR;
                        }
                    }
                }
            }

            // 2. 💣 爆破・巻き込み判定
            // パーツの各構成ドットの「周囲5×5マス」にある作品ブロックを巻き込んで爆破回収！
            let explodedCount = 0;
            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        let centerY = currentPiece.y + r;
                        let centerX = currentPiece.x + c;

                        // 周囲2マス（5×5のエリア）をスキャン
                        for (let ey = centerY - 2; ey <= centerY + 2; ey++) {
                            for (let ex = centerX - 2; ex <= centerX + 2; ex++) {
                                if (ey >= 0 && ey < ROWS && ex >= 0 && ex < COLS) {
                                    // 空ではなく、かつ自分で落としたパーツ(PIECE_COLOR)以外の色（＝ユーザーの作品）があれば消去
                                    if (grid[ey][ex] && grid[ey][ex] !== PIECE_COLOR) {
                                        grid[ey][ex] = null; // 消去！
                                        explodedCount++;
                                    }
                                }
                            }
                        }
                    }
                }
            }

            // スコア加算（作品を消すほど高得点）
            if (explodedCount > 0) {
                score += explodedCount * 10;
                document.getElementById('scoreVal').innerText = score;
                // 特典ゲームらしいエフェクト効果の代わりにフラッシュ的な全描画更新
            }

            // 盤面全体の3D表示をリフレッシュ
            drawFullGrid3D();

            // 次のパーツへ
            spawnPiece();
        }

        // ゲームループのタイマー開始
        function startTimer() {
            if (dropInterval) clearInterval(dropInterval);
            dropInterval = setInterval(() => {
                movePiece(0, 1);
            }, 800); // 0.8秒ごとに自動落下
        }

        function endGame() {
            isGameOver = true;
            clearInterval(dropInterval);
            document.getElementById('finalScore').innerText = `獲得スコア: ${score} 点`;
            document.getElementById('gameOverOverlay').style.display = 'flex';
        }

        function resetGame() {
            initGame();
            drawFullGrid3D();
            spawnPiece();
            startTimer();
        }

        // 4. Three.jsのレンダリングループ
        function animate() {
            requestAnimationFrame(animate);
            // 落下アニメーションなどをスムーズに見せるため毎フレームレンダリング
            renderer.render(scene, camera);
        }

        // PC用キーボード操作のバインド
        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            switch(e.key) {
                case 'ArrowLeft':  movePiece(-1, 0); break;
                case 'ArrowRight': movePiece(1, 0); break;
                case 'ArrowDown':  movePiece(0, 1); break;
                case 'ArrowUp':    movePiece(0, 0, true); break; // 上キーで回転
                case ' ':          dropInstant(); break; // スペースで即落下
            }
        });
    </script>
</body>
</html>
