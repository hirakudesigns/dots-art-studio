<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOTS ART STUDIO - Magic Editor 3D & Game</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root { 
            --primary-color: #6c5ce7; 
            --bg-color: #f2f2f2;
            --card-bg: #ffffff; 
            --accent-color: #ff7675; 
            --save-green: #55efc4;
        }
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background-color: var(--bg-color); margin: 0; padding: 10px; overflow-x: hidden; }
        .header-area { width: 100%; max-width: 500px; display: flex; justify-content: center; align-items: center; padding: 5px 0; gap: 10px; }
        .header-logo { height: 24px; width: auto; }
        h1 { margin: 0; font-size: 1rem; color: #333; font-weight: 800; }
        
        .step-tabs { display: flex; width: 100%; max-width: 500px; background: #e4e7eb; border-radius: 12px; padding: 4px; margin-bottom: 10px; box-sizing: border-box; }
        .tab { flex: 1; text-align: center; padding: 8px 0; font-size: 0.7rem; font-weight: bold; color: #747d8c; border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .tab.active { background: var(--card-bg); color: var(--primary-color); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .tab-num { font-size: 0.55rem; opacity: 0.7; }

        .app-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 10px; }

        .canvas-area { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 1 / 1;
            max-width: 360px;
            border: 4px solid var(--card-bg); 
            border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            background: #fff; 
            touch-action: none; 
            overflow: hidden; 
        }
        .canvas-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
        #sketchCanvas { z-index: 2; background: transparent; }
        #dotCanvas { z-index: 3; image-rendering: pixelated; width: 100%; height: 100%; display: none; }
        #gridCanvas { z-index: 10; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        
        #threeContainer { z-index: 4; position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        #bgLayer { z-index: 1; position:absolute; top:0; left:0; width:100%; height:100%; display: none; overflow: hidden; pointer-events: none; }
        #bgVideo { width: 100%; height: 100%; object-fit: cover; }

        #gameContainer { z-index: 20; position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; background: #222; }
        #gameCanvas { width: 100%; height: 100%; background: #111; }

        .control-panel { width: 100%; background: var(--card-bg); padding: 15px; border-radius: 20px; box-sizing: border-box; display: none; flex-direction: column; gap: 12px; }
        .control-panel.active { display: flex; }
        .section-label { font-size: 0.65rem; color: #a1a1a1; font-weight: bold; text-transform: uppercase; margin-bottom: -5px; }
        .row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; align-items: center; }
        
        .btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; border-radius: 10px; background: #f1f2f6; color: #57606f; padding: 0; box-sizing: border-box; }
        .btn.active { background: var(--primary-color); color: white; }
        .btn img { width: 24px; height: 24px; object-fit: contain; }
        
        .btn-magic { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; height: 55px; font-weight: 900; border-radius: 15px; border: none; cursor: pointer; width: 100%; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-upload { background: var(--primary-color); color: white; height: 55px; font-weight: 900; border-radius: 15px; border: none; cursor: pointer; width: 100%; font-size: 1.1rem; }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(108, 92, 231, 0.85); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-top: 5px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">作品をアップロード中...</div>
    </div>

    <div class="header-area">
        <img src="DOTS_PROJECT_logo_black.png" alt="DOTS" class="header-logo">
        <h1>MAGIC STUDIO 3D</h1>
    </div>

    <div class="step-tabs">
        <div class="tab active" id="tab-step1" onclick="switchStep(1)"><span class="tab-num">STEP 01</span>らくがき</div>
        <div class="tab" id="tab-step2" onclick="switchStep(2)"><span class="tab-num">STEP 02</span>どっと化</div>
        <div class="tab" id="tab-step3" onclick="switchStep(3)"><span class="tab-num">STEP 03</span>立体プレビュー</div>
        <div class="tab" id="tab-step4" onclick="switchStep(4)"><span class="tab-num">STEP 04</span>送信</div>
    </div>

    <div class="app-container">
        <div class="canvas-area" id="canvasArea">
            <div class="canvas-wrapper">
                <div id="bgLayer"><video id="bgVideo" autoplay playsinline muted></video></div>
                <canvas id="sketchCanvas"></canvas>
                <canvas id="dotCanvas" width="32" height="32"></canvas>
                <canvas id="gridCanvas"></canvas>
                <div id="threeContainer"></div>
                
                <div id="gameContainer">
                    <canvas id="gameCanvas"></canvas>
                </div>
            </div>
        </div>
        
        <div class="row" id="history-row" style="gap:20px; margin: 5px 0;">
            <button class="btn" id="btn-undo" style="border-radius:50%; background:#fff; box-shadow:0 3px 6px rgba(0,0,0,0.1);"><span class="material-icons">undo</span></button>
            <button class="btn" id="btn-redo" style="border-radius:50%; background:#fff; box-shadow:0 3px 6px rgba(0,0,0,0.1);"><span class="material-icons">redo</span></button>
        </div>

        <div class="control-panel active" id="panel-step1">
            <div class="section-label">らくがき・スキャンツール</div>
            <div class="row">
                <input type="color" id="sketchColor" value="#000000" style="width:40px; height:40px; border:none; background:none; cursor:pointer;">
                <button class="btn active" id="btn-sketch-pen"><span class="material-icons">edit</span></button>
                <button class="btn" id="btn-sketch-eraser"><img src="eraser.png" alt="消しゴム"></button>
                <button class="btn" id="btn-sketch-bucket"><span class="material-icons">format_color_fill</span></button>
                <button class="btn" id="btn-sketch-picker"><span class="material-icons">colorize</span></button>
                
                <button class="btn" id="btn-sketch-camera" style="background:#e3f2fd; color:#1e88e5; font-size:0.75rem; width:auto; padding:0 8px; gap:4px;">
                    <span class="material-icons">photo_camera</span><span id="camera-btn-text">かみの絵をスキャン</span>
                </button>
                
                <button class="btn" id="btn-sketch-clear" style="color:var(--accent-color); margin-left: auto;"><span class="material-icons">delete_outline</span></button>
            </div>
            <p style="font-size:0.75rem; color:#747d8c; text-align:center; margin: 5px 0;">画面に描くか、カメラで紙の絵をパシャッと写してみよう！</p>
            <button class="btn-magic" onclick="magicConvert()"><span class="material-icons">auto_awesome</span> ドット絵に変身させる！</button>
        </div>

        <div class="control-panel" id="panel-step2">
            <div class="section-label">ドット微調整ツール</div>
            <div class="row">
                <input type="color" id="colorPicker" value="#000000" style="width:40px; height:40px; border:none; background:none; cursor:pointer;">
                <button class="btn active" id="btn-pen"><span class="material-icons">edit</span></button>
                <button class="btn" id="btn-eraser"><img src="eraser.png" alt="消しゴム"></button> 
                <button class="btn" id="btn-bucket"><span class="material-icons">format_color_fill</span></button>
                <button class="btn" id="btn-picker"><span class="material-icons">colorize</span></button>
                <button class="btn" id="btn-toggle-grid" style="margin-left: auto;"><span class="material-icons">grid_on</span></button>
            </div>
            <div class="section-label">カラーパレット</div>
            <div class="row" style="justify-content: space-between;">
                <div id="paletteArea" class="row" style="min-height:30px; justify-content:flex-start; gap:6px;"></div>
                <button class="btn" id="btn-save-palette" style="width:auto; padding:0 8px; font-size:0.7rem; height:34px;">色を登録</button>
            </div>
            <button class="btn-magic" style="background: var(--primary-color);" onclick="goTo3DStep()">3Dボクセルにする！ <span class="material-icons">view_in_ar</span></button>
        </div>

        <div class="control-panel" id="panel-step3">
            <div class="section-label">3D立体プレビュー</div>
            <p style="font-size:0.8rem; color:#333; text-align:center; margin: 5px 0; font-weight: bold;">存在感ばつぐんの厚み（3.0）のブロックフィギュアになりました！</p>
            <p style="font-size:0.75rem; color:#747d8c; text-align:center; margin: 0 0 5px 0;">🖯 グルグル回して色々な角度からチェックできます</p>
            <button class="btn-magic" style="background: var(--primary-color);" onclick="switchStep(4)">これで決定！次にすすむ <span class="material-icons">arrow_forward</span></button>
        </div>

        <div class="control-panel" id="panel-step4">
            <div class="section-label">作品の名前</div>
            <input type="text" id="artName" placeholder="作品の名前を入力..." style="width:100%; height:45px; border-radius:10px; border:2px solid #ddd; padding:0 10px; box-sizing:border-box;">

            <div class="section-label">完成背景デザイン</div>
            <select id="bgSelect" class="sidebar-select" style="width: 100%; height: 40px; border-radius: 10px; border: 2px solid #f1f2f6; padding: 0 10px; font-weight: bold; color: #57606f;">
                <option value="">背景なし（透明）</option>
                <option value="bg1.jpg">背景デザイン1</option>
                <option value="bg2.jpg">背景デザイン2</option>
            </select>

            <button class="btn-upload" id="uploadButton">作品をアップロード！</button>
        </div>

        <div class="control-panel" id="panel-game">
            <div class="section-label">特典ゲーム：DOTS ブロック崩し</div>
            <p style="font-size:0.8rem; color:#333; text-align:center; margin: 5px 0; font-weight: bold;">あなたが作ったドット絵がブロックステージになりました！</p>
            <div class="row" style="justify-content:space-around;">
                <button class="btn-magic" style="background:#20bf6b; height:44px; font-size:0.9rem;" onclick="startGame()">ゲームスタート</button>
            </div>
        </div>
    </div>

    <script>
        const sCanvas = document.getElementById('sketchCanvas');
        const sCtx = sCanvas.getContext('2d');
        const dCanvas = document.getElementById('dotCanvas');
        const dCtx = dCanvas.getContext('2d');
        const gCanvas = document.getElementById('gridCanvas');
        const gCtx = gCanvas.getContext('2d');
        
        const canvasArea = document.getElementById('canvasArea');
        const bgLayer = document.getElementById('bgLayer');
        const bgVideo = document.getElementById('bgVideo');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const artNameInput = document.getElementById('artName');
        const paletteArea = document.getElementById('paletteArea');
        const colorPicker = document.getElementById('colorPicker');
        const sketchColor = document.getElementById('sketchColor');
        const threeContainer = document.getElementById('threeContainer');
        const gameContainer = document.getElementById('gameContainer');
        const gameCanvas = document.getElementById('gameCanvas');

        let currentStep = 1;
        let isDrawing = false;
        let sketchMode = 'pen';
        let dotMode = 'pen';
        let historyStack = { 1: [], 2: [] };
        let startTime = Date.now();
        let gridActive = true;
        
        let isCameraActive = false;
        let videoStream = null;
        
        let lastCanvasWidth = 0;
        let lastCanvasHeight = 0;

        const VOXEL_HEIGHT = 3.0;

        let scene, camera, renderer, controls, voxelGroup;
        let isThreeInitialized = false;

        const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbxLN0lTux5SRb8cI3lYp1sXBCEPHW4x4B-px7AguEjgvMHqA7wRipvF05iI5UiQJ_WknA/exec"; 
        const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfNwyTLJ_-3FJx5oBbgzULdlWZ8TrVfyH6eHv5V4pXlAhP34Q/viewform";

        function initCanvasSize() {
            const rect = canvasArea.getBoundingClientRect();
            const newWidth = Math.floor(rect.width);
            const newHeight = Math.floor(rect.height);

            if (newWidth !== lastCanvasWidth || newHeight !== lastCanvasHeight) {
                const tempSketch = document.createElement('canvas');
                tempSketch.width = sCanvas.width; tempSketch.height = sCanvas.height;
                if(sCanvas.width > 0) tempSketch.getContext('2d').drawImage(sCanvas, 0, 0);

                sCanvas.width = newWidth;
                sCanvas.height = newHeight;
                sCtx.lineCap = 'round';
                sCtx.lineJoin = 'round';
                sCtx.lineWidth = 8; 

                gCanvas.width = newWidth;
                gCanvas.height = newHeight;

                if(tempSketch.width > 0) {
                    sCtx.drawImage(tempSketch, 0, 0, newWidth, newHeight);
                }

                lastCanvasWidth = newWidth;
                lastCanvasHeight = newHeight;
                
                drawGrid();
                if (isThreeInitialized && renderer) {
                    renderer.setSize(newWidth, newHeight);
                    updateCameraAspect();
                }
            }
        }

        function drawGrid() {
            gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);
            if (!gridActive) return;

            const w = gCanvas.width;
            const h = gCanvas.height;
            const stepX = w / 32;
            const stepY = h / 32;
            gCtx.lineWidth = 0.8;

            for (let i = 1; i < 32; i++) {
                gCtx.beginPath();
                if (i % 8 === 0) {
                    gCtx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
                } else {
                    gCtx.strokeStyle = 'rgba(0, 0, 0, 0.12)';
                }
                gCtx.moveTo(i * stepX, 0); gCtx.lineTo(i * stepX, h);
                gCtx.moveTo(0, i * stepY); gCtx.lineTo(w, i * stepY);
                gCtx.stroke();
            }
        }

        // ==================== 📷 STEP1専用：カメラ・スキャンロジック ====================
        async function toggleCamera() {
            if (!isCameraActive) {
                // カメラを起動して背景ストリーミング開始
                try {
                    const constraints = {
                        video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 640 } },
                        audio: false
                    };
                    videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                    bgVideo.srcObject = videoStream;
                    bgVideo.style.display = "block";
                    bgLayer.style.backgroundImage = "none";
                    bgLayer.style.display = "block";
                    
                    isCameraActive = true;
                    document.getElementById('btn-sketch-camera').style.background = '#ff7675';
                    document.getElementById('btn-sketch-camera').style.color = '#fff';
                    document.getElementById('camera-btn-text').innerText = "パシャッ！（しゃったー）";
                } catch (err) {
                    console.error("Camera failed:", err);
                    alert("カメラの起動に失敗しました。カメラのアクセス権限を確認してください。");
                }
            } else {
                // シャッターを切り、現在の映像フレームをキャンバスに写し取って固定する
                try {
                    sCtx.globalCompositeOperation = 'source-over';
                    sCtx.drawImage(bgVideo, 0, 0, sCanvas.width, sCanvas.height);
                    saveHistory(1);
                    autoSaveToStorage();
                } catch(e) { console.error("Capture failed:", e); }

                stopCameraMode();
            }
        }

        function stopCameraMode() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            bgVideo.srcObject = null;
            bgVideo.style.display = "none";
            bgLayer.style.display = "none";
            
            isCameraActive = false;
            document.getElementById('btn-sketch-camera').style.background = '#e3f2fd';
            document.getElementById('btn-sketch-camera').style.color = '#1e88e5';
            document.getElementById('camera-btn-text').innerText = "かみの絵をスキャン";
        }

        document.getElementById('btn-sketch-camera').onclick = toggleCamera;

        function autoSaveToStorage() {
            try {
                localStorage.setItem('dots_backup_sketch', sCanvas.toDataURL());
                localStorage.setItem('dots_backup_dot', dCanvas.toDataURL());
                localStorage.setItem('dots_backup_artname', artNameInput.value);
            } catch (e) { console.warn("AutoSave failed:", e); }
        }

        function loadFromStorageBackup() {
            const savedName = localStorage.getItem('dots_backup_artname');
            if (savedName) artNameInput.value = savedName;

            const savedSketch = localStorage.getItem('dots_backup_sketch');
            if (savedSketch) {
                const img = new Image(); img.src = savedSketch;
                img.onload = () => { sCtx.drawImage(img, 0, 0, sCanvas.width, sCanvas.height); saveHistory(1); };
            }
            const savedDot = localStorage.getItem('dots_backup_dot');
            if (savedDot) {
                const img = new Image(); img.src = savedDot;
                img.onload = () => { dCtx.clearRect(0,0,32,32); dCtx.drawImage(img, 0, 0, 32, 32); saveHistory(2); };
            }
        }

        window.addEventListener('resize', initCanvasSize);
        window.addEventListener('DOMContentLoaded', () => {
            initCanvasSize();
            dCtx.clearRect(0, 0, 32, 32);
            saveHistory(2);
            saveHistory(1);
            loadFromStorageBackup();
        });

        function switchStep(step) {
            currentStep = step;
            document.querySelectorAll('.tab').forEach((t, i) => { t.classList.toggle('active', i === step - 1); });
            document.querySelectorAll('.control-panel').forEach((p, i) => { p.classList.toggle('active', i === step - 1); });
            document.getElementById('history-row').style.display = (step <= 2) ? 'flex' : 'none';

            sCanvas.style.display = (step === 1) ? 'block' : 'none';
            dCanvas.style.display = (step === 2 || step === 4) ? 'block' : 'none';
            threeContainer.style.display = (step === 3) ? 'block' : 'none';
            
            gCanvas.style.display = (step === 2) ? 'block' : 'none';
            if(step === 2) drawGrid();
            if (step === 3) updateThreeMesh();

            // STEP1から離れる時はカメラを自動で安全にクローズ
            if (step !== 1 && isCameraActive) {
                stopCameraMode();
            }
        }

        function goTo3DStep() {
            if (!isThreeInitialized) {
                initThree();
            } else {
                updateCameraAspect();
            }
            switchStep(3);
        }

        function initThree() {
            const rect = canvasArea.getBoundingClientRect();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            const aspect = rect.width / rect.height;
            const d = 20;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(25, 25, 25);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(rect.width, rect.height);
            threeContainer.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.1;

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            voxelGroup = new THREE.Group();
            scene.add(voxelGroup);
            isThreeInitialized = true;

            function animate3D() {
                requestAnimationFrame(animate3D);
                if (currentStep === 3) {
                    controls.update();
                    renderer.render(scene, camera);
                }
            }
            animate3D();
        }

        function updateCameraAspect() {
            if (!camera || !canvasArea) return;
            const rect = canvasArea.getBoundingClientRect();
            const aspect = rect.width / rect.height;
            const d = 20;
            camera.left = -d * aspect; camera.right = d * aspect;
            camera.top = d; camera.bottom = -d;
            camera.updateProjectionMatrix();
        }

        function updateThreeMesh() {
            if (!isThreeInitialized) return;
            while(voxelGroup.children.length > 0){
                const obj = voxelGroup.children[0];
                obj.geometry.dispose(); obj.material.dispose();
                voxelGroup.remove(obj);
            }

            const imgData = dCtx.getImageData(0, 0, 32, 32).data;
            const boxGeo = new THREE.BoxGeometry(1, VOXEL_HEIGHT, 1);

            for (let y = 0; y < 32; y++) {
                for (let x = 0; x < 32; x++) {
                    const idx = (y * 32 + x) * 4;
                    if (imgData[idx + 3] < 128) continue;

                    const mat = new THREE.MeshStandardMaterial({
                        color: new THREE.Color(`rgb(${imgData[idx]},${imgData[idx+1]},${imgData[idx+2]})`),
                        roughness: 0.4
                    });
                    const mesh = new THREE.Mesh(boxGeo, mat);
                    mesh.position.set(x - 16, VOXEL_HEIGHT / 2, y - 16);
                    voxelGroup.add(mesh);
                }
            }
            voxelGroup.position.set(0, -VOXEL_HEIGHT / 2, 0);
        }

        function magicConvert() {
            const tempCanvas = document.createElement('canvas'); 
            tempCanvas.width = tempCanvas.height = 32;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.imageSmoothingEnabled = false; 
            tCtx.drawImage(sCanvas, 0, 0, 32, 32);
            
            const imgData = tCtx.getImageData(0, 0, 32, 32);
            const data = imgData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                let alpha = data[i + 3];
                if (alpha > 40) { 
                    data[i + 3] = 255; 
                    if(data[i] > 245 && data[i+1] > 245 && data[i+2] > 245) {
                        data[i + 3] = 0;
                    }
                } else {
                    data[i + 3] = 0; 
                }
            }
            dCtx.clearRect(0, 0, 32, 32);
            dCtx.putImageData(imgData, 0, 0);
            
            saveHistory(2); 
            autoSaveToStorage();
            switchStep(2);
        }

        function generateRbxmXml() {
            const imgData = dCtx.getImageData(0, 0, 32, 32).data;
            let xml = `<roblox xmlns:xd="http://www.w3.org/2006/xd" version="4">\n  <Item class="Folder" referent="RBX0">\n    <Properties>\n      <string name="Name">${artNameInput.value.trim() || "VoxelModel"}</string>\n    </Properties>\n`;
            let partCount = 1;
            for (let y = 0; y < 32; y++) {
                for (let x = 0; x < 32; x++) {
                    const idx = (y * 32 + x) * 4;
                    if (imgData[idx + 3] < 128) continue;
                    xml += `    <Item class="Part" referent="RBX_Part_${partCount}">\n      <Properties>\n        <string name="Name">V_${partCount}</string>\n        <bool name="Anchored">true</bool>\n        <Color3 name="Color"><R>${(imgData[idx]/255).toFixed(6)}</R><G>${(imgData[idx+1]/255).toFixed(6)}</G><B>${(imgData[idx+2]/255).toFixed(6)}</B></Color3>\n        <CoordinateFrame name="CFrame">\n          <X>${x - 16}</X><Y>${VOXEL_HEIGHT / 2}</Y><Z>${y - 16}</Z>\n          <R00>1</R00><R01>0</R01><R02>0</R02><R10>0</R10><R11>1</R11><R12>0</R12><R20>0</R20><R21>0</R21><R22>1</R22>\n        </CoordinateFrame>\n        <Vector3 name="size"><X>1</X><Y>${VOXEL_HEIGHT.toFixed(2)}</Y><Z>1</Z></Vector3>\n        <token name="Material">256</token>\n      </Properties>\n    </Item>\n`;
                    partCount++;
                }
            }
            return xml + `  </Item>\n</roblox>\n`;
        }

        function generateObjText() {
            const imgData = dCtx.getImageData(0, 0, 32, 32).data;
            let obj = `# DOTS 3D OBJ Export\n`;
            let vCount = 1;
            for (let y = 0; y < 32; y++) {
                for (let x = 0; x < 32; x++) {
                    const idx = (y * 32 + x) * 4;
                    if (imgData[idx + 3] < 128) continue;
                    const px = x - 16, py = 0, pz = y - 16, h = VOXEL_HEIGHT;
                    obj += `v ${px} ${py} ${pz}\nv ${px+1} ${py} ${pz}\nv ${px+1} ${py+h} ${pz}\nv ${px} ${py+h} ${pz}\n`;
                    obj += `v ${px} ${py} ${pz+1}\nv ${px+1} ${py+h} ${pz+1}\nv ${px+1} ${py+h} ${pz+1}\nv ${px} ${py+h} ${pz+1}\n`;
                    obj += `f ${vCount} ${vCount+1} ${vCount+2} ${vCount+3}\nf ${vCount+5} ${vCount+4} ${vCount+7} ${vCount+6}\n`;
                    obj += `f ${vCount} ${vCount+3} ${vCount+7} ${vCount+4}\nf ${vCount+1} ${vCount+5} ${vCount+6} ${vCount+2}\n`;
                    obj += `f ${vCount+3} ${vCount+2} ${vCount+6} ${vCount+7}\nf ${vCount} ${vCount+4} ${vCount+5} ${vCount+1}\n`;
                    vCount += 8;
                }
            }
            return obj;
        }

        function executeCanvasBucket(ctx, startX, startY, fillHex, width, height) {
            const imageData = ctx.getImageData(0, 0, width, height), data = imageData.data;
            const baseIdx = (startY * width + startX) * 4;
            const startR = data[baseIdx], startG = data[baseIdx + 1], startB = data[baseIdx + 2], startA = data[baseIdx + 3];
            const fillR = parseInt(fillHex.slice(1,3), 16), fillG = parseInt(fillHex.slice(3,5), 16), fillB = parseInt(fillHex.slice(5,7), 16), fillA = 255;
            if (startR === fillR && startG === fillG && startB === fillB && startA === fillA) return;
            const stack = [[startX, startY]];
            while (stack.length > 0) {
                const [x, y] = stack.pop(); const idx = (y * width + x) * 4;
                if (Math.abs(data[idx] - startR) < 10 && Math.abs(data[idx+1] - startG) < 10 && Math.abs(data[idx+2] - startB) < 10 && Math.abs(data[idx+3] - startA) < 10) {
                    data[idx] = fillR; data[idx+1] = fillG; data[idx+2] = fillB; data[idx+3] = fillA;
                    if (x > 0) stack.push([x - 1, y]); if (x < width - 1) stack.push([x + 1, y]);
                    if (y > 0) stack.push([x, y - 1]); if (y < height - 1) stack.push([x, y + 1]);
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function executeCanvasPicker(ctx, x, y, width, height, targetPicker) {
            const imgData = ctx.getImageData(x, y, 1, 1).data;
            if (imgData[3] === 0) return;
            const hex = "#" + ("000000" + ((imgData[0] << 16) | (imgData[1] << 8) | imgData[2]).toString(16)).slice(-6);
            targetPicker.value = hex;
        }

        function getCanvasTouchPos(e) {
            const rect = canvasArea.getBoundingClientRect();
            const p = e.touches ? e.touches[0] : e;
            return { x: p.clientX - rect.left, y: p.clientY - rect.top };
        }
        
        canvasArea.addEventListener('mousedown', startDrawing);
        canvasArea.addEventListener('touchstart', startDrawing, {passive: false});
        window.addEventListener('mousemove', draw);
        window.addEventListener('touchmove', draw, {passive: false});
        window.addEventListener('mouseup', stopDrawing);
        window.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            if (currentStep > 2) return;
            if (e.touches) e.preventDefault(); 
            isDrawing = true; 
            const pos = getCanvasTouchPos(e);
            
            if (currentStep === 1) { 
                const rx = Math.floor(pos.x), ry = Math.floor(pos.y);
                if (sketchMode === 'bucket') {
                    executeCanvasBucket(sCtx, rx, ry, sketchColor.value, sCanvas.width, sCanvas.height);
                    stopDrawing();
                } else if (sketchMode === 'picker') {
                    executeCanvasPicker(sCtx, rx, ry, sCanvas.width, sCanvas.height, sketchColor);
                    stopDrawing();
                } else {
                    sCtx.beginPath(); sCtx.moveTo(pos.x, pos.y); 
                }
            } else if (currentStep === 2) {
                handleDotAction(pos.x, pos.y);
            }
        }

        function draw(e) {
            if (!isDrawing || currentStep > 2) return;
            if (e.touches) e.preventDefault();
            const pos = getCanvasTouchPos(e);
            
            if (currentStep === 1) {
                if (sketchMode === 'pen' || sketchMode === 'eraser') {
                    sCtx.strokeStyle = sketchMode === 'eraser' ? '#ffffff' : sketchColor.value;
                    sCtx.globalCompositeOperation = sketchMode === 'eraser' ? 'destination-out' : 'source-over';
                    sCtx.lineTo(pos.x, pos.y); sCtx.stroke();
                }
            } else if (currentStep === 2) {
                handleDotAction(pos.x, pos.y);
            }
        }

        function stopDrawing() { 
            if (isDrawing && currentStep <= 2) {
                saveHistory(currentStep); 
                autoSaveToStorage();
            } 
            isDrawing = false; 
        }

        function handleDotAction(clientX, clientY) {
            const rect = canvasArea.getBoundingClientRect();
            const x = Math.floor(clientX / (rect.width / 32)), y = Math.floor(clientY / (rect.height / 32));
            if (x < 0 || x >= 32 || y < 0 || y >= 32) return;
            
            if (dotMode === 'pen') { dCtx.fillStyle = colorPicker.value; dCtx.fillRect(x, y, 1, 1); }
            else if (dotMode === 'eraser') dCtx.clearRect(x, y, 1, 1);
            else if (dotMode === 'bucket') { executeCanvasBucket(dCtx, x, y, colorPicker.value, 32, 32); isDrawing = false; }
            else if (dotMode === 'picker') { executeCanvasPicker(dCtx, x, y, 32, 32, colorPicker); isDrawing = false; }
        }

        function saveHistory(step) {
            const cvs = step === 1 ? sCanvas : dCanvas;
            historyStack[step].push(cvs.toDataURL());
            if(historyStack[step].length > 30) historyStack[step].shift();
        }

        document.getElementById('btn-undo').onclick = () => {
            const stack = historyStack[currentStep];
            if (stack && stack.length > 1) {
                stack.pop(); const prev = stack[stack.length - 1]; const img = new Image(); img.src = prev;
                img.onload = () => {
                    if (currentStep === 1) {
                        sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height); sCtx.drawImage(img, 0, 0, sCanvas.width, sCanvas.height);
                    } else {
                        dCtx.clearRect(0, 0, 32, 32); dCtx.drawImage(img, 0, 0, 32, 32);
                    }
                    autoSaveToStorage();
                };
            }
        };

        const sTools = {pen:'btn-sketch-pen', eraser:'btn-sketch-eraser', bucket:'btn-sketch-bucket', picker:'btn-sketch-picker'};
        Object.keys(sTools).forEach(k => {
            document.getElementById(sTools[k]).onclick = () => {
                sketchMode = k; Object.values(sTools).forEach(id => document.getElementById(id).classList.remove('active'));
                document.getElementById(sTools[k]).classList.add('active');
            };
        });
        document.getElementById('btn-sketch-clear').onclick = () => { if(confirm("らくがきをぜんぶ消しますか？")) { sCtx.clearRect(0,0,sCanvas.width,sCanvas.height); saveHistory(1); autoSaveToStorage(); } };

        const dTools = {pen:'btn-pen', eraser:'btn-eraser', bucket:'btn-bucket', picker:'btn-picker'};
        Object.keys(dTools).forEach(k => {
            document.getElementById(dTools[k]).onclick = () => {
                dotMode = k; Object.values(dTools).forEach(id => document.getElementById(id).classList.remove('active'));
                document.getElementById(dTools[k]).classList.add('active');
            };
        });
        document.getElementById('btn-toggle-grid').onclick = () => { gridActive = !gridActive; drawGrid(); };

        document.getElementById('btn-save-palette').onclick = () => {
            const col = colorPicker.value; const item = document.createElement('div'); item.className = 'palette-item';
            const chip = document.createElement('div'); chip.className = 'color-chip'; chip.style.backgroundColor = col;
            chip.onclick = () => colorPicker.value = col;
            const del = document.createElement('div'); del.className = 'delete-badge'; del.innerHTML = '×'; del.onclick = () => item.remove();
            item.appendChild(chip); item.appendChild(del); paletteArea.appendChild(item);
        };

        artNameInput.oninput = autoSaveToStorage;

        document.getElementById('bgSelect').onchange = (e) => {
            const val = e.target.value; bgLayer.style.backgroundImage = val ? `url(${val})` : ''; bgLayer.style.display = val ? 'block' : 'none';
        };

        // ==================== 🏹 アップロード・送信処理 ====================
        document.getElementById('uploadButton').onclick = async () => {
            const name = artNameInput.value.trim();
            if (!name) { alert("作品名を入力してください。"); artNameInput.focus(); return; }

            const durationSeconds = Math.floor((Date.now() - startTime) / 1000);
            
            const uploadCanvas = document.createElement('canvas');
            uploadCanvas.width = uploadCanvas.height = 512;
            const uctx = uploadCanvas.getContext('2d');
            uctx.imageSmoothingEnabled = false; 

            const bgSelect = document.getElementById('bgSelect').value;
            if (bgSelect) {
                const bgImg = new Image(); bgImg.src = bgSelect;
                try {
                    await new Promise(resolve => { bgImg.onload = resolve; bgImg.onerror = resolve; });
                    uctx.drawImage(bgImg, 0, 0, 512, 512);
                } catch(e){}
            }
            uctx.drawImage(dCanvas, 0, 0, 512, 512);
            
            const base64Data = uploadCanvas.toDataURL('image/png').split(',')[1];
            const rbxmData = generateRbxmXml();
            const objData = generateObjText();

            if(!confirm(`「${name}」をアップロードして、アンケートおよび限定特典ゲームをアンロックしますか？`)) return;

            loadingOverlay.style.display = 'flex';

            try {
                const response = await fetch(GAS_ENDPOINT, {
                    method: "POST",
                    body: JSON.stringify({
                        image: base64Data,
                        rbxm: rbxmData,
                        obj: objData,
                        name: name, 
                        location: "WEB_MAGIC_3D_MULTIOUT", 
                        duration: durationSeconds
                    })
                });
                const result = await response.json();

                if(result.status === "success") {
                    localStorage.removeItem('dots_backup_sketch');
                    localStorage.removeItem('dots_backup_dot');
                    localStorage.removeItem('dots_backup_artname');

                    try { await navigator.clipboard.writeText(result.serial); } catch(e) {}
                    loadingOverlay.style.display = 'none';
                    
                    alert(`アップロード成功！\n管理番号「${result.serial}」をコピーしました。\nOKを押すと、限定ブロック崩しゲームが解放されます！`);
                    
                    unlockGameMode();

                    const params = new URLSearchParams();
                    params.append("entry.46158305", name);
                    params.append("entry.1524592109", result.serial);
                    window.open(`${FORM_URL}?${params.toString()}`, '_blank');
                    
                } else {
                    loadingOverlay.style.display = 'none';
                    alert("エラー: " + result.message);
                }
            } catch (error) {
                loadingOverlay.style.display = 'none';
                alert("通信エラーが発生しました。");
            }
        };

        // ==================== 🎮 特典：ブロック崩しゲームロジック ====================
        let gameBlocks = [];
        let paddle = { x: 0, y: 0, width: 60, height: 10 };
        let ball = { x: 0, y: 0, vx: 3, vy: -3, radius: 6 };
        let gameAnimFrame = null;
        let isGameRunning = false;

        function unlockGameMode() {
            currentStep = 5;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.control-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-game').classList.add('active');
            
            sCanvas.style.display = 'none';
            dCanvas.style.display = 'none';
            threeContainer.style.display = 'none';
            gCanvas.style.display = 'none';
            bgLayer.style.display = 'none';
            
            gameContainer.style.display = 'block';
            resizeGameCanvas();
            initGameStage();
        }

        function resizeGameCanvas() {
            const rect = canvasArea.getBoundingClientRect();
            gameCanvas.width = rect.width;
            gameCanvas.height = rect.height;
        }

        function initGameStage() {
            gameBlocks = [];
            const imgData = dCtx.getImageData(0, 0, 32, 32).data;
            const bw = gameCanvas.width / 32;
            const bh = (gameCanvas.height * 0.5) / 32;

            for (let y = 0; y < 32; y++) {
                for (let x = 0; x < 32; x++) {
                    const idx = (y * 32 + x) * 4;
                    if (imgData[idx + 3] >= 128) {
                        gameBlocks.push({
                            x: x * bw,
                            y: y * bh,
                            w: bw - 0.5,
                            h: bh - 0.5,
                            color: `rgb(${imgData[idx]},${imgData[idx+1]},${imgData[idx+2]})`
                        });
                    }
                }
            }

            paddle.width = gameCanvas.width * 0.2;
            paddle.x = (gameCanvas.width - paddle.width) / 2;
            paddle.y = gameCanvas.height - 25;

            ball.x = gameCanvas.width / 2;
            ball.y = paddle.y - 15;
            ball.vx = 2.5 * (Math.random() > 0.5 ? 1 : -1);
            ball.vy = -3.5;

            drawGameStatic();
        }

        function drawGameStatic() {
            const gCtx = gameCanvas.getContext('2d');
            gCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

            gameBlocks.forEach(b => {
                gCtx.fillStyle = b.color;
                gCtx.fillRect(b.x, b.y, b.w, b.h);
            });

            gCtx.fillStyle = varColor('--primary-color', '#6c5ce7');
            gCtx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

            gCtx.beginPath();
            gCtx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            gCtx.fillStyle = '#ff7675';
            gCtx.fill();
            gCtx.closePath();
        }

        function varColor(varName, fallback) {
            return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || fallback;
        }

        function startGame() {
            if (isGameRunning) return;
            isGameRunning = true;
            initGameStage();
            gameLoop();
        }

        function gameLoop() {
            if (!isGameRunning) return;
            updateGameObjects();
            drawGameStatic();
            gameAnimFrame = requestAnimationFrame(gameLoop);
        }

        function updateGameObjects() {
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.x - ball.radius < 0 || ball.x + ball.radius > gameCanvas.width) ball.vx *= -1;
            if (ball.y - ball.radius < 0) ball.vy *= -1;

            if (ball.y + ball.radius >= paddle.y && ball.y - ball.radius <= paddle.y + paddle.height) {
                if (ball.x >= paddle.x && ball.x <= paddle.x + paddle.width) {
                    ball.vy = -Math.abs(ball.vy);
                    let hitPos = (ball.x - paddle.x) / paddle.width;
                    ball.vx = 6 * (hitPos - 0.5);
                }
            }

            for (let i = gameBlocks.length - 1; i >= 0; i--) {
                let b = gameBlocks[i];
                if (ball.x + ball.radius > b.x && ball.x - ball.radius < b.x + b.w &&
                    ball.y + ball.radius > b.y && ball.y - ball.radius < b.y + b.h) {
                    ball.vy *= -1;
                    gameBlocks.splice(i, 1);
                    break;
                }
            }

            if (ball.y > gameCanvas.height) {
                isGameRunning = false;
                cancelAnimationFrame(gameAnimFrame);
                alert("ゲームオーバー！もう一回チャレンジしよう！");
                initGameStage();
            }

            if (gameBlocks.length === 0) {
                isGameRunning = false;
                cancelAnimationFrame(gameAnimFrame);
                alert("すごーい！ステージクリア！おめでとう！🎉");
            }
        }

        function movePaddle(clientX) {
            const rect = gameCanvas.getBoundingClientRect();
            let targetX = clientX - rect.left - paddle.width / 2;
            if (targetX < 0) targetX = 0;
            if (targetX > gameCanvas.width - paddle.width) targetX = gameCanvas.width - paddle.width;
            paddle.x = targetX;
        }

        gameCanvas.addEventListener('mousemove', (e) => { if(isGameRunning) movePaddle(e.clientX); });
        gameCanvas.addEventListener('touchmove', (e) => { 
            if(isGameRunning && e.touches.length > 0) {
                e.preventDefault();
                movePaddle(e.touches[0].clientX);
            }
        }, { passive: false });

    </script>
</body>
