<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOTS ブロック崩し - インベーダーステージ</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { 
            --primary-color: #ef4444; 
            --accent-color: #ff7675; 
            --cyber-neon: #ff00ff;
            --cyber-bg: #05020c;
        }
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--cyber-bg); 
            font-family: 'Segoe UI', sans-serif; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* ヘッダー */
        .game-header {
            width: 100%; height: 44px; background: rgba(5, 2, 12, 0.85);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 10; border-bottom: 1px solid rgba(255, 0, 255, 0.2);
            backdrop-filter: blur(4px);
        }
        .game-title { margin: 0; font-size: 0.9rem; color: #fff; font-weight: 800; }
        .art-name { color: #0be881; }
        .btn-close-top { 
            background: none; border: none; color: #a1a1a1; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; padding: 5px;
        }

        /* ゲームメインエリア */
        .game-container { flex: 1; width: 100%; position: relative; background: var(--cyber-bg); }
        canvas { display: block; width: 100%; height: 100%; }

        /* スライドガイド案内 */
        .slide-guide-area {
            position: absolute; bottom: 35px; left: 5%; width: 90%; height: 40px;
            border: 2px dashed rgba(255, 0, 255, 0.4); border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255, 0, 255, 0.8); font-size: 0.8rem; font-weight: bold;
            pointer-events: none; z-index: 3; transition: opacity 0.4s;
            background: rgba(255, 0, 255, 0.05);
        }
        .slide-guide-area span { margin: 0 10px; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* タイトル画面オーバーレイ */
        .game-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 2, 12, 0.96);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center; z-index: 5; transition: opacity 0.3s ease;
        }
        .overlay-title { color: #fff; font-size: 1.8rem; font-weight: 900; margin-bottom: 5px; text-shadow: 0 0 12px var(--cyber-neon); }
        .overlay-subtitle { color: #a1a1a1; font-size: 0.85rem; margin-top: 0; margin-bottom: 20px; }
        
        .art-preview-box {
            width: 110px; height: 110px; background: #120920; border-radius: 12px;
            margin-bottom: 20px; border: 2px solid rgba(255, 0, 255, 0.3);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
        }
        #titlePreviewCanvas { width: 100%; height: 100%; image-rendering: pixelated; }

        /* 操作案内ビジュアル */
        .how-to-play-visual {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            color: #a1a1a1; font-size: 0.75rem; margin-bottom: 25px;
        }
        .mock-paddle-bar { width: 80px; height: 12px; background: #00d2d3; border-radius: 4px; position: relative; }
        .mock-hand-icon { position: absolute; top: 8px; left: 30px; color: #fff; animation: handMove 2s infinite ease-in-out; }
        @keyframes handMove { 0%, 100% { left: 10px; } 50% { left: 50px; } }

        .btn-start-game {
            background: linear-gradient(135deg, #20bf6b, #0be881); color: white;
            padding: 14px 45px; font-size: 1.15rem; font-weight: 900;
            border: none; border-radius: 50px; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 6px 20px rgba(32, 191, 107, 0.4);
        }

        /* 終了後UI */
        .game-controls-ui {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: none; gap: 15px; width: 90%; max-width: 320px; z-index: 6;
        }
        .btn-ui {
            flex: 1; height: 46px; border: none; border-radius: 10px; font-weight: bold;
            font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-ui-retry { background: #fff; color: #333; }
        .btn-ui-close { background: var(--accent-color); color: #fff; }
    </style>
</head>
<body>

    <div class="game-header">
        <h1 class="game-title">🔮 ATTACK STAGE: <span id="target-art-name" class="art-name">読み込み中...</span></h1>
        <button class="btn-close-top" onclick="closeGameWindow()"><span class="material-icons">close</span></button>
    </div>

    <div class="game-container" id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div class="slide-guide-area" id="slideGuide">
            <span class="material-icons">west</span>
            <span>さわって左右にスライドしてスタート！</span>
            <span class="material-icons">east</span>
        </div>

        <div class="game-overlay" id="titleOverlay">
            <h2 class="overlay-title">DOTS BLOCK CRASH</h2>
            <p class="overlay-subtitle">イラストが下までせまってきたら負けちゃうぞ！</p>
            
            <div class="art-preview-box">
                <canvas id="titlePreviewCanvas" width="32" height="32"></canvas>
            </div>

            <div class="how-to-play-visual">
                <div class="mock-paddle-bar">
                    <span class="material-icons mock-hand-icon">touch_app</span>
                </div>
                <span>画面の下側をスライドしてパドルをうごかそう</span>
            </div>

            <button class="btn-start-game" onclick="clickStartButton()">
                <span class="material-icons">play_arrow</span> ゲームスタート！
            </button>
        </div>

        <div class="game-controls-ui" id="gameControlsUI">
            <button class="btn-ui btn-ui-retry" onclick="initGameStage()"><span class="material-icons">refresh</span>もう一度</button>
            <button class="btn-ui btn-ui-close" onclick="closeGameWindow()"><span class="material-icons">exit_to_app</span>おわる</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const artNameLabel = document.getElementById('target-art-name');
        const titleOverlay = document.getElementById('titleOverlay');
        const gameControlsUI = document.getElementById('gameControlsUI');
        const slideGuide = document.getElementById('slideGuide');
        const titlePreviewCanvas = document.getElementById('titlePreviewCanvas');
        const tpCtx = titlePreviewCanvas.getContext('2d');

        let gameBlocks = [];
        let balls = []; 
        let items = []; 
        
        // 🟥 スライドバー（パドル）の縦幅を少し太く修正 (12 -> 18)
        let paddle = { x: 0, y: 0, width: 90, height: 18 };
        
        let globalBallSpeed = 5.5;
        let penetrateTimer = 0; 
        
        let blockAdvanceTimer = 0;
        let currentBlockSize = 0; 
        
        let gameAnimFrame = null;
        let isGameRunning = false;
        let isGameOverState = false;
        let hasPlayerMoved = false; 
        let isFirstShotFired = false; 
        
        const hiddenCanvas = document.createElement('canvas');
        hiddenCanvas.width = hiddenCanvas.height = 32;
        const hCtx = hiddenCanvas.getContext('2d');

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            paddle.width = Math.min(canvas.width * 0.25, 100); 
            paddle.y = canvas.height - 60; 
            if (!isGameRunning && !isGameOverState) {
                initGameStagePositions();
            }
            drawGameScene();
        }

        function loadTargetVoxelData() {
            const urlParams = new URLSearchParams(window.location.search);
            let name = urlParams.get('name') || localStorage.getItem('dots_latest_name') || 'まいさくひん';
            artNameLabel.innerText = name;

            const savedMatrix = localStorage.getItem('dots_latest_matrix');
            if (savedMatrix) {
                const img = new Image();
                img.src = savedMatrix;
                img.onload = () => {
                    hCtx.clearRect(0, 0, 32, 32); hCtx.drawImage(img, 0, 0, 32, 32);
                    tpCtx.clearRect(0, 0, 32, 32); tpCtx.drawImage(img, 0, 0, 32, 32);
                    initGameStage();
                };
            } else {
                hCtx.fillStyle = '#6c5ce7'; hCtx.fillRect(4, 8, 24, 8);
                tpCtx.fillStyle = '#6c5ce7'; tpCtx.fillRect(4, 8, 24, 8);
                initGameStage();
            }
        }

        function initGameStage() {
            if (gameAnimFrame) cancelAnimationFrame(gameAnimFrame);
            isGameRunning = false;
            isGameOverState = false;
            hasPlayerMoved = false;
            isFirstShotFired = false; 
            penetrateTimer = 0;
            blockAdvanceTimer = 0; 
            gameControlsUI.style.display = 'none';
            slideGuide.style.opacity = '1';

            gameBlocks = [];
            balls = [];
            items = [];

            currentBlockSize = canvas.width / 32; 
            const startOffsetY = 15; 

            const imgData = hCtx.getImageData(0, 0, 32, 32).data;
            for (let y = 0; y < 32; y++) {
                for (let x = 0; x < 32; x++) {
                    const idx = (y * 32 + x) * 4;
                    const r = imgData[idx]; const g = imgData[idx+1]; const b = imgData[idx+2]; const a = imgData[idx+3];

                    if (a < 128) continue;
                    if (r >= 210 && g >= 210 && b >= 210) continue; 

                    gameBlocks.push({
                        x: x * currentBlockSize, y: y * currentBlockSize + startOffsetY,
                        w: currentBlockSize - 0.6, h: currentBlockSize - 0.6,
                        color: `rgb(${r},${g},${b})`
                    });
                }
            }
            initGameStagePositions();
            isGameRunning = true;
            gameLoop();
        }

        function initGameStagePositions() {
            paddle.x = (canvas.width - paddle.width) / 2;
            balls = [{
                x: paddle.x + paddle.width / 2,
                y: paddle.y - 12,
                vx: 0, vy: 0, 
                radius: 7
            }];
        }

        function drawCyberBackground() {
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#04010a');
            grad.addColorStop(0.4, '#0a0314');
            grad.addColorStop(1, '#19052a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 0, 255, 0.08)';
            ctx.lineWidth = 1;
            
            let vanishingPointX = canvas.width / 2; 
            let vanishingPointY = canvas.height * 0.15;

            let numLines = 40;
            for (let i = 0; i <= numLines; i++) {
                let angle = (Math.PI * 2) * (i / numLines);
                let targetX = vanishingPointX + Math.cos(angle) * canvas.width * 1.5;
                let targetY = vanishingPointY + Math.sin(angle) * canvas.height * 1.5;
                ctx.beginPath(); ctx.moveTo(vanishingPointX, vanishingPointY); ctx.lineTo(targetX, targetY); ctx.stroke();
            }

            for (let j = 0; j < 16; j++) {
                let yBase = vanishingPointY + (canvas.height - vanishingPointY) * Math.pow(j / 15, 2.3);
                ctx.strokeStyle = `rgba(239, 68, 180, ${0.02 + (j/15) * 0.18})`;
                ctx.lineWidth = 1 + (j / 15) * 1.5;
                ctx.shadowColor = '#ff00ff';
                ctx.shadowBlur = j > 10 ? 8 : 0; 
                ctx.beginPath(); ctx.moveTo(0, yBase); ctx.lineTo(canvas.width, yBase); ctx.stroke();
            }
            ctx.shadowBlur = 0; 
        }

        function drawGameScene() {
            drawCyberBackground();

            gameBlocks.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.strokeRect(b.x, b.y, b.w, b.h);
            });

            items.forEach(item => {
                ctx.beginPath();
                ctx.arc(item.x, item.y, 9, 0, Math.PI * 2);
                ctx.fillStyle = item.type === 'multi' ? '#0be881' : '#f5cd79'; 
                ctx.fill();
                ctx.closePath();

                ctx.fillStyle = '#000'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(item.type === 'multi' ? '2' : '★', item.x, item.y + 3.5);
            });

            // パドル描画（太さ18pxにアップ）
            ctx.fillStyle = penetrateTimer > 0 ? '#f5cd79' : '#00d2d3';
            if(penetrateTimer > 0) { ctx.shadowColor = '#f5cd79'; ctx.shadowBlur = 15; }
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.shadowBlur = 0;

            balls.forEach(ball => {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = penetrateTimer > 0 ? '#f5cd79' : '#ff7675';
                if(penetrateTimer > 0) { ctx.shadowColor = '#f5cd79'; ctx.shadowBlur = 10; }
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;
            });
        }

        function clickStartButton() {
            titleOverlay.style.opacity = 0;
            setTimeout(() => {
                titleOverlay.style.display = 'none';
                initGameStage();
            }, 300);
        }

        function gameLoop() {
            if (!isGameRunning) return;
            updatePhysics();
            drawGameScene();
            gameAnimFrame = requestAnimationFrame(gameLoop);
        }

        function updatePhysics() {
            if (penetrateTimer > 0) penetrateTimer--;

            if (isFirstShotFired) {
                blockAdvanceTimer++;
                if (blockAdvanceTimer >= 600) {
                    blockAdvanceTimer = 0;
                    gameBlocks.forEach(b => { b.y += currentBlockSize; });
                }
            }

            // アイテム移動と回収
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += 2.5;

                if (item.y + 9 >= paddle.y && item.y - 9 <= paddle.y + paddle.height &&
                    item.x >= paddle.x && item.x <= paddle.x + paddle.width) {
                    activateItemEffect(item.type);
                    items.splice(i, 1);
                    continue;
                }
                if (item.y > canvas.height) items.splice(i, 1);
            }

            // ボール物理
            for (let i = balls.length - 1; i >= 0; i--) {
                let ball = balls[i];
                ball.x += ball.vx;
                ball.y += ball.vy;

                if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -1; }
                if (ball.x + ball.radius > canvas.width) { ball.x = canvas.width - ball.radius; ball.vx *= -1; }
                if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy *= -1; }

                if (ball.y + ball.radius >= paddle.y && ball.y - ball.radius <= paddle.y + paddle.height) {
                    if (ball.x >= paddle.x && ball.x <= paddle.x + paddle.width) {
                        ball.vy = -Math.abs(ball.vy);
                        let hitPos = (ball.x - paddle.x) / paddle.width;
                        let angle = (hitPos - 0.5) * (Math.PI * 0.35);
                        ball.vx = globalBallSpeed * Math.sin(angle);
                        ball.vy = -globalBallSpeed * Math.cos(angle);
                    }
                }

                for (let j = gameBlocks.length - 1; j >= 0; j--) {
                    let b = gameBlocks[j];
                    if (ball.x + ball.radius > b.x && ball.x - ball.radius < b.x + b.w &&
                        ball.y + ball.radius > b.y && ball.y - ball.radius < b.y + b.h) {
                        
                        if (penetrateTimer <= 0) {
                            let overlapX = Math.min(ball.x + ball.radius - b.x, b.x + b.w - (ball.x - ball.radius));
                            let overlapY = Math.min(ball.y + ball.radius - b.y, b.y + b.h - (ball.y - ball.radius));
                            if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;
                        }

                        if (Math.random() < 0.06) {
                            items.push({ x: b.x + b.w/2, y: b.y + b.h, type: Math.random() > 0.4 ? 'multi' : 'penetrate' });
                        }
                        gameBlocks.splice(j, 1);
                        break;
                    }
                }
                if (ball.y > canvas.height) balls.splice(i, 1);
            }

            // 🟥 イラストが下まで来てしまったら「負け」
            if (gameBlocks.length > 0) {
                let maxBlockY = 0;
                gameBlocks.forEach(b => { if(b.y + b.h > maxBlockY) maxBlockY = b.y + b.h; });
                
                if (maxBlockY >= paddle.y) {
                    endGameSession(false); // 負け判定で終了
                    return;
                }
            }

            if (balls.length === 0 && isFirstShotFired) endGameSession(false);
            if (gameBlocks.length === 0 && isFirstShotFired) endGameSession(true);
        }

        function activateItemEffect(type) {
            if (type === 'multi') {
                if (balls.length > 0) {
                    let b = balls[0];
                    balls.push({ x: b.x, y: b.y, vx: -b.vx || -2, vy: b.vy, radius: 7 });
                }
            } else if (type === 'penetrate') {
                penetrateTimer = 180; 
            }
        }

        function endGameSession(isWin) {
            isGameRunning = false;
            isGameOverState = true;
            if(gameAnimFrame) cancelAnimationFrame(gameAnimFrame);
            
            setTimeout(() => {
                if (isWin) {
                    alert("すごーい！ぜんぶ崩せたね！ステージクリア！🎉");
                } else {
                    alert("イラストに押しつぶされちゃった！きみの負け！👾");
                }
                gameControlsUI.style.display = 'flex';
            }, 100);
        }

        function handleInputMove(clientX) {
            if (isGameOverState) return;

            const rect = canvas.getBoundingClientRect();
            let targetX = clientX - rect.left - paddle.width / 2;
            if (targetX < 0) targetX = 0;
            if (targetX > canvas.width - paddle.width) targetX = canvas.width - paddle.width;
            paddle.x = targetX;
            
            if(!hasPlayerMoved) {
                hasPlayerMoved = true;
                slideGuide.style.opacity = '0';
            }

            if (!isFirstShotFired && balls.length > 0) {
                isFirstShotFired = true;
                balls[0].vx = (Math.random() - 0.5) * 3;
                balls[0].vy = -globalBallSpeed;
            }

            if (!isFirstShotFired && balls.length > 0) {
                balls[0].x = paddle.x + paddle.width / 2;
                balls[0].y = paddle.y - 12;
            }
        }

        canvas.addEventListener('mousemove', (e) => { handleInputMove(e.clientX); });
        canvas.addEventListener('touchmove', (e) => { 
            if(e.touches.length > 0) {
                e.preventDefault();
                handleInputMove(e.touches[0].clientX);
            }
        }, { passive: false });
        
        canvas.addEventListener('touchstart', (e) => {
            if(e.touches.length > 0) handleInputMove(e.touches[0].clientX);
        }, { passive: false });

        // 🟥 「おわる」処理：ドット絵アプリのURLへ直接リダイレクト遷移
        function closeGameWindow() {
            window.location.href = "https://hirakudesigns.github.io/dots-art-studio/";
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            loadTargetVoxelData();
        });
    </script>
</body>
</html>
