<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOTS ブロック崩し - 限定特典ステージ</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { 
            --primary-color: #6c5ce7; 
            --accent-color: #ff7675; 
            --bg-dark: #111116;
        }
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-dark); 
            font-family: 'Segoe UI', sans-serif; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* 上部ヘッダー（作品名表示） */
        .game-header {
            width: 100%; height: 44px; background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .game-title { margin: 0; font-size: 0.9rem; color: #fff; font-weight: 800; }
        .art-name { color: #0be881; }
        .btn-close-top { 
            background: none; border: none; color: #a1a1a1; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; padding: 5px;
        }

        /* ゲームメインエリア（全画面） */
        .game-container {
            flex: 1; width: 100%; position: relative; background: #000;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* タイトル画面・オーバーレイ */
        .game-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 17, 22, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center; z-index: 5;
            transition: opacity 0.3s ease;
        }
        .overlay-title { color: #fff; font-size: 1.8rem; font-weight: 900; margin-bottom: 5px; text-shadow: 0 0 10px var(--primary-color); }
        .overlay-subtitle { color: #a1a1a1; font-size: 0.85rem; margin-top: 0; margin-bottom: 30px; }
        
        .art-preview-box {
            width: 120px; height: 120px; background: #222; border-radius: 12px;
            margin-bottom: 30px; border: 2px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #titlePreviewCanvas { width: 100%; height: 100%; image-rendering: pixelated; }

        .btn-start-game {
            background: linear-gradient(135deg, #20bf6b, #0be881); color: white;
            padding: 15px 40px; font-size: 1.2rem; font-weight: 900;
            border: none; border-radius: 50px; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 6px 20px rgba(32, 191, 107, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 6px 20px rgba(32, 191, 107, 0.4); }
            50% { transform: scale(1.04); box-shadow: 0 6px 30px rgba(32, 191, 107, 0.6); }
            100% { transform: scale(1); box-shadow: 0 6px 20px rgba(32, 191, 107, 0.4); }
        }

        /* リトライ・おわるボタン（画面下部またはゲームオーバー時） */
        .game-controls-ui {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: none; gap: 15px; width: 90%; max-width: 320px; z-index: 6;
        }
        .btn-ui {
            flex: 1; height: 44px; border: none; border-radius: 10px; font-weight: bold;
            font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-ui-retry { background: #fff; color: #333; }
        .btn-ui-close { background: var(--accent-color); color: #fff; }
    </style>
</head>
<body>

    <!-- ヘッダーエリア -->
    <div class="game-header">
        <h1 class="game-title">🎨 DOTS STAGE: <span id="target-art-name" class="art-name">読み込み中...</span></h1>
        <button class="btn-close-top" onclick="closeGameWindow()"><span class="material-icons">close</span></button>
    </div>

    <!-- ゲーム本体全画面エリア -->
    <div class="game-container" id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- タイトル画面オーバーレイ -->
        <div class="game-overlay" id="titleOverlay">
            <h2 class="overlay-title">DOTS BLOCK CRASH</h2>
            <p class="overlay-subtitle">きみが作ったドット絵の世界であそぼう！</p>
            
            <div class="art-preview-box">
                <canvas id="titlePreviewCanvas" width="32" height="32"></canvas>
            </div>

            <button class="btn-start-game" onclick="clickStartButton()">
                <span class="material-icons">play_arrow</span> ゲームスタート！
            </button>
        </div>

        <!-- ゲーム中・終了後の簡易UI（必要なときだけ表示） -->
        <div class="game-controls-ui" id="gameControlsUI">
            <button class="btn-ui btn-ui-retry" onclick="initGameStage()"><span class="material-icons">refresh</span>もう一度</button>
            <button class="btn-ui btn-ui-close" onclick="closeGameWindow()"><span class="material-icons">exit_to_app</span>おわる</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const artNameLabel = document.getElementById('target-art-name');
        const titleOverlay = document.getElementById('titleOverlay');
        const gameControlsUI = document.getElementById('gameControlsUI');
        const titlePreviewCanvas = document.getElementById('titlePreviewCanvas');
        const tpCtx = titlePreviewCanvas.getContext('2d');

        let gameBlocks = [];
        let paddle = { x: 0, y: 0, width: 90, height: 12 };
        let ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 7, speed: 5 };
        let gameAnimFrame = null;
        let isGameRunning = false;
        let isGameOverState = false;
        
        // データのバックアップを保持する隠しキャンバス
        const hiddenCanvas = document.createElement('canvas');
        hiddenCanvas.width = hiddenCanvas.height = 32;
        const hCtx = hiddenCanvas.getContext('2d');

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // パドルのサイズや位置を画面に合わせて再調整
            paddle.width = Math.min(canvas.width * 0.25, 100); 
            paddle.y = canvas.height - 50; 
            if (!isGameRunning && !isGameOverState) {
                initGameStagePositions();
            }
            drawGameScene();
        }

        function loadTargetVoxelData() {
            const urlParams = new URLSearchParams(window.location.search);
            let serial = urlParams.get('serial') || localStorage.getItem('dots_latest_serial') || '---';
            let name = urlParams.get('name') || localStorage.getItem('dots_latest_name') || 'まいさくひん';
            
            artNameLabel.innerText = name;

            const savedMatrix = localStorage.getItem('dots_latest_matrix');
            if (savedMatrix) {
                const img = new Image();
                img.src = savedMatrix;
                img.onload = () => {
                    hCtx.clearRect(0, 0, 32, 32);
                    hCtx.drawImage(img, 0, 0, 32, 32);
                    
                    // タイトル画面用のプレビューにも描画
                    tpCtx.clearRect(0, 0, 32, 32);
                    tpCtx.drawImage(img, 0, 0, 32, 32);
                    
                    initGameStage();
                };
            } else {
                // ダミーデータ生成（データがない場合）
                hCtx.fillStyle = '#6c5ce7';
                hCtx.fillRect(4, 8, 24, 8);
                tpCtx.fillStyle = '#6c5ce7';
                tpCtx.fillRect(4, 8, 24, 8);
                initGameStage();
            }
        }

        function initGameStage() {
            if (isGameRunning) {
                isGameRunning = false;
                cancelAnimationFrame(gameAnimFrame);
            }
            isGameOverState = false;
            gameControlsUI.style.display = 'none';

            gameBlocks = [];
            const imgData = hCtx.getImageData(0, 0, 32, 32).data;
            
            // 🛑 横に潰れるのを防ぐ：画面幅ベースで「正方形（等倍）」のドットサイズを割り出す
            const blockSize = canvas.width / 32; 
            
            // ドット配置の開始Y座標（上部に少しマージンを空ける）
            const startOffsetY = 40; 

            for (let y = 0; y < 32; y++) {
                for (let x = 0; x < 32; x++) {
                    const idx = (y * 32 + x) * 4;
                    const r = imgData[idx];
                    const g = imgData[idx+1];
                    const b = imgData[idx+2];
                    const a = imgData[idx+3];

                    // 1. 透明ピクセルをスキップ
                    if (a < 128) continue;
                    
                    // 2. 🟢 黒色（RGBがすべて20以下の極めて暗い色）を壁と認識せずスキップ
                    if (r <= 20 && g <= 20 && b <= 20) continue;

                    // ブロックとして登録（サイズは縦横一律の正方形）
                    gameBlocks.push({
                        x: x * blockSize,
                        y: y * blockSize + startOffsetY,
                        w: blockSize - 0.5, // 境界線を見せるためわずかに小さく
                        h: blockSize - 0.5,
                        color: `rgb(${r},${g},${b})`
                    });
                }
            }
            initGameStagePositions();
        }

        // ボールとパドルの初期位置計算
        function initGameStagePositions() {
            paddle.x = (canvas.width - paddle.width) / 2;
            ball.x = canvas.width / 2;
            ball.y = paddle.y - 15;
            ball.vx = 0;
            ball.vy = 0;
            drawGameScene();
        }

        function drawGameScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景に薄い近未来風のグリッドを敷く（全画面化の演出効果）
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const space = 40;
            for(let x=0; x<canvas.width; x+=space) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for(let y=0; y<canvas.height; y+=space) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

            // ブロック描画
            gameBlocks.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
            });

            // パドル描画
            ctx.fillStyle = '#6c5ce7';
            ctx.shadowColor = '#6c5ce7';
            ctx.shadowBlur = 8;
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.shadowBlur = 0; // シャドウを戻す

            // ボール描画
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff7675';
            ctx.fill();
            ctx.closePath();
        }

        function clickStartButton() {
            titleOverlay.style.opacity = 0;
            setTimeout(() => {
                titleOverlay.style.display = 'none';
                countdownAndStart();
            }, 300);
        }

        function countdownAndStart() {
            initGameStage();
            // 最初の射出ベクトルを設定
            ball.vx = (Math.random() - 0.5) * 3;
            ball.vy = -ball.speed;
            isGameRunning = true;
            gameLoop();
        }

        function gameLoop() {
            if (!isGameRunning) return;
            updatePhysics();
            drawGameScene();
            gameAnimFrame = requestAnimationFrame(gameLoop);
        }

        function updatePhysics() {
            ball.x += ball.vx;
            ball.y += ball.vy;

            // 左右の壁跳ね返り
            if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -1; }
            if (ball.x + ball.radius > canvas.width) { ball.x = canvas.width - ball.radius; ball.vx *= -1; }
            
            // 天井跳ね返り
            if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy *= -1; }

            // パドルとの衝突
            if (ball.y + ball.radius >= paddle.y && ball.y - ball.radius <= paddle.y + paddle.height) {
                if (ball.x >= paddle.x && ball.x <= paddle.x + paddle.width) {
                    ball.vy = -Math.abs(ball.vy);
                    // 当たった位置で反射角度を変える
                    let hitPos = (ball.x - paddle.x) / paddle.width;
                    let angle = (hitPos - 0.5) * (Math.PI * 0.4); // 最大左右45度程度
                    ball.vx = ball.speed * Math.sin(angle);
                    ball.vy = -ball.speed * Math.cos(angle);
                }
            }

            // ブロックとの衝突判定
            for (let i = gameBlocks.length - 1; i >= 0; i--) {
                let b = gameBlocks[i];
                if (ball.x + ball.radius > b.x && ball.x - ball.radius < b.x + b.w &&
                    ball.y + ball.radius > b.y && ball.y - ball.radius < b.y + b.h) {
                    
                    // 衝突した方向を割り出して跳ね返す（簡易判定）
                    let overlapX = Math.min(ball.x + ball.radius - b.x, b.x + b.w - (ball.x - ball.radius));
                    let overlapY = Math.min(ball.y + ball.radius - b.y, b.y + b.h - (ball.y - ball.radius));

                    if (overlapX < overlapY) {
                        ball.vx *= -1;
                    } else {
                        ball.vy *= -1;
                    }
                    
                    gameBlocks.splice(i, 1);
                    break;
                }
            }

            // ゲームオーバー判定
            if (ball.y > canvas.height) {
                endGameSession(false);
            }

            // ステージクリア判定
            if (gameBlocks.length === 0) {
                endGameSession(true);
            }
        }

        function endGameSession(isWin) {
            isGameRunning = false;
            isGameOverState = true;
            cancelAnimationFrame(gameAnimFrame);
            
            setTimeout(() => {
                if (isWin) {
                    alert("すごーい！ぜんぶ崩せたね！ステージクリア！🎉");
                } else {
                    alert("あちゃー！ゲームオーバー！もう一回やってみよう！");
                }
                gameControlsUI.style.display = 'flex'; // 下部コントロールUIを出現させる
            }, 100);
        }

        function movePaddle(clientX) {
            const rect = canvas.getBoundingClientRect();
            let targetX = clientX - rect.left - paddle.width / 2;
            if (targetX < 0) targetX = 0;
            if (targetX > canvas.width - paddle.width) targetX = canvas.width - paddle.width;
            paddle.x = targetX;
            if (!isGameRunning && !isGameOverState) ball.x = paddle.x + paddle.width / 2; // 開始前はボールが追従
        }

        // 全画面でのパドル操作（マウス＆タッチ）
        canvas.addEventListener('mousemove', (e) => { movePaddle(e.clientX); });
        canvas.addEventListener('touchmove', (e) => { 
            if(e.touches.length > 0) {
                e.preventDefault();
                movePaddle(e.touches[0].clientX);
            }
        }, { passive: false });

        function closeGameWindow() {
            if(confirm("ゲームをおわりますか？")) {
                if(window.history.length > 1) {
                    window.history.back();
                } else {
                    window.close();
                }
            }
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            loadTargetVoxelData();
        });
    </script>
</body>
</html>
