<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCAN! MONSTERS - 受付端末</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#0B0F1A;
  --panel:#131A2B;
  --panel2:#1B2440;
  --line:#2A3452;
  --green:#39FF88;
  --magenta:#FF3D81;
  --amber:#FFC247;
  --text:#E8ECF4;
  --muted:#8792B0;
}
html{background:var(--bg);overscroll-behavior-y:none;}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  overscroll-behavior-y:none;
  background:
    radial-gradient(circle at 15% 0%, rgba(57,255,136,0.06), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(255,61,129,0.07), transparent 45%),
    var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono', monospace;
  padding:20px 14px 60px;
}
.wrap{max-width:480px;margin:0 auto;padding-bottom:78px;}

/* header */
h1{
  font-family:'Press Start 2P', monospace;
  font-size:15px;
  line-height:1.6;
  color:var(--green);
  text-shadow:0 0 12px rgba(57,255,136,0.5);
  text-align:center;
  margin:4px 0 4px;
  letter-spacing:1px;
}
.sub{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-bottom:18px;
  letter-spacing:1px;
}

/* tabs */
.tabs{
  display:flex;
  gap:8px;
  align-items:flex-end;
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:50;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(11,15,26,0), var(--bg) 30%);
  max-width:480px;
  margin:0 auto;
}
.tab{
  flex:1;
  padding:14px 4px;
  text-align:center;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  cursor:pointer;
  border-radius:10px;
  transition:.15s;
}
.tab.tab-secondary{
  flex:0.55;
  padding:10px 2px;
  font-size:10px;
  font-weight:400;
  align-self:center;
}
.tab.active{
  background:var(--panel2);
  color:var(--green);
  border-color:var(--green);
  box-shadow:0 0 10px rgba(57,255,136,0.15) inset;
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px;
  margin-bottom:14px;
}
.hidden{display:none !important;}

/* scan panel */
.scan-display{
  background:#050810;
  border:1px solid var(--line);
  border-radius:6px;
  padding:10px 12px;
  margin-bottom:8px;
  min-height:40px;
  display:flex;
  align-items:center;
  gap:10px;
}
.scan-display .bars{
  display:flex;gap:1px;height:26px;
}
.scan-display .bars span{
  width:2px;background:var(--green);opacity:.85;
}
.scan-display input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:var(--green);
  font-family:'JetBrains Mono',monospace;
  font-size:16px;
  letter-spacing:2px;
}
.scan-display input::placeholder{color:#2f3d5c;}

.btn-row{display:flex;gap:8px;}
button{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:1px;
  border-radius:6px;
  border:1px solid var(--line);
  padding:11px 10px;
  cursor:pointer;
  background:var(--panel2);
  color:var(--text);
  transition:.15s;
}
button:active{transform:scale(.97);}
.btn-primary{
  flex:2;
  background:linear-gradient(135deg,var(--green),#1fd66e);
  color:#03170c;
  border:none;
  font-weight:700;
}
.btn-ghost{flex:1;color:var(--muted);}
.icon-btn{
  flex-shrink:0;
  width:34px;height:34px;
  padding:0;
  border-radius:50%;
  background:var(--panel2);
  color:var(--green);
  font-size:15px;
  display:flex;align-items:center;justify-content:center;
}
.msg{font-size:10.5px;color:var(--magenta);min-height:14px;margin-top:5px;letter-spacing:.5px;}

/* card */
.card-stage{perspective:1100px;margin-top:8px;}
.card-flip{
  position:relative;
  display:grid;
  transform-style:preserve-3d;
  transition:transform .8s cubic-bezier(.2,.8,.2,1);
  animation:revealPop .4s cubic-bezier(.2,.9,.3,1.2);
}
.card-flip.flipped{transform:rotateY(180deg);}
@keyframes revealPop{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
.card-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.card-back{transform:rotateY(0deg);}
.card-front{transform:rotateY(180deg);}
.card{
  border-radius:14px;
  padding:12px;
  position:relative;
  overflow:hidden;
  border:6px solid var(--rc,var(--line));
  background:linear-gradient(160deg, var(--panel2), #0c1122 70%);
  box-shadow:0 0 0 rgba(0,0,0,0);
}
.card.ss{
  border-image:linear-gradient(120deg,#ff5a3c,#ffd93c,#4cd97b,#3ca7ff,#9b5cff,#ff6fd8) 1;
  animation:rainbow 4s linear infinite;
}
@keyframes rainbow{
  0%{box-shadow:0 0 16px #ff5a3c55;}
  20%{box-shadow:0 0 16px #ffd93c55;}
  40%{box-shadow:0 0 16px #4cd97b55;}
  60%{box-shadow:0 0 16px #3ca7ff55;}
  80%{box-shadow:0 0 16px #9b5cff55;}
  100%{box-shadow:0 0 16px #ff5a3c55;}
}
.card-back{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:260px;
}
.card-back-mark{
  font-family:'Press Start 2P',monospace;
  font-size:16px;
  color:var(--green);
  text-shadow:0 0 14px rgba(57,255,136,0.5);
  text-align:center;
  letter-spacing:1px;
}
.card-back-bars{display:flex;gap:2px;height:22px;margin-top:14px;justify-content:center;}
.card-back-bars span{width:2px;background:var(--green);opacity:.7;}

/* ホロ加工風の光沢 */
.holo-sweep{
  position:absolute;inset:0;
  background:linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.18) 35%, rgba(255,255,255,0.35) 42%, rgba(255,255,255,0.18) 48%, transparent 65%);
  background-size:250% 250%;
  animation:holoSweep 3.2s ease-in-out infinite;
  pointer-events:none;
  mix-blend-mode:overlay;
  z-index:6;
}
@keyframes holoSweep{
  0%{background-position:0% 0%;}
  50%{background-position:100% 100%;}
  100%{background-position:0% 0%;}
}
.holo-pointer{
  position:absolute;inset:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.4), transparent 45%);
  pointer-events:none;
  mix-blend-mode:overlay;
  z-index:6;
  opacity:0;
  transition:opacity .2s ease;
}
.card-front:hover .holo-pointer, .card-front.holo-active .holo-pointer{opacity:1;}

/* スキャンライン */
.scanlines{
  position:absolute;inset:0;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 3px);
  pointer-events:none;
  opacity:.5;
  animation:scanDrift 6s linear infinite;
  z-index:5;
}
@keyframes scanDrift{
  0%{background-position:0 0;}
  100%{background-position:0 40px;}
}

/* 属性アンビエントパーティクル */
.ambient-layer{
  position:absolute;inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:1;
}
.ambient-particle{
  position:absolute;
  bottom:-10px;
  border-radius:50%;
  animation-name:ambientFloat;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
}
@keyframes ambientFloat{
  0%{transform:translate(0,0);opacity:0;}
  10%{opacity:.85;}
  90%{opacity:.6;}
  100%{transform:translate(var(--dx,10px),-320px);opacity:0;}
}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;position:relative;z-index:7;}
.card-content{position:relative;z-index:7;}
.elem-badge{
  width:48px;height:48px;
  border-radius:50%;
  background:var(--ec);
  border:2px solid rgba(0,0,0,0.35);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  font-weight:700;
  color:#0B0F1A;
  box-shadow:0 0 12px var(--ec);
  flex-shrink:0;
}
.card-name-big{
  font-size:16px;
  font-weight:700;
  letter-spacing:.5px;
  text-align:center;
  margin:4px 0 6px;
}
.rarity-badge{
  font-size:10px;
  font-weight:700;
  padding:3px 8px;
  border-radius:20px;
  border:1px solid var(--rc,var(--line));
  color:var(--rc,var(--text));
  white-space:nowrap;
  height:fit-content;
}
.pixel-frame{
  display:flex;justify-content:center;margin:4px 0 6px;
}
.card-power{
  text-align:center;
  font-size:9px;
  color:var(--muted);
  letter-spacing:2px;
  margin:4px 0 2px;
}
.power-val{
  display:block;
  font-family:'Press Start 2P',monospace;
  font-size:17px;
  color:var(--amber);
  text-shadow:0 0 12px rgba(255,194,71,0.6);
  margin-top:2px;
}
.parts-line{
  text-align:center;
  font-size:9px;
  color:var(--muted);
  letter-spacing:.5px;
  margin-bottom:6px;
}
.pixel-grid{
  display:block;
  image-rendering:pixelated;
}
.pixel-frame .pixel-grid{
  background:#050810;
  padding:5px;
  border-radius:8px;
  border:1px solid var(--line);
}
.mini-pixel .pixel-grid{
  background:#050810;
  padding:4px;
  border-radius:6px;
  border:1px solid var(--line);
}

.stat-row{display:flex;align-items:center;gap:8px;font-size:9.5px;margin-bottom:3px;}
.stat-label{width:32px;color:var(--muted);}
.stat-bar{flex:1;height:6px;background:#050810;border-radius:4px;overflow:hidden;}
.stat-fill{height:100%;border-radius:4px;transition:width .5s ease;box-shadow:0 0 6px 0 currentColor;}
.stat-val{width:22px;text-align:right;color:var(--text);}

.card-footer{
  margin-top:6px;
  padding-top:6px;
  border-top:1px dashed var(--line);
  display:flex;justify-content:center;align-items:center;
  font-size:9px;color:var(--muted);letter-spacing:1px;
}

/* collection */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.mini-card{
  background:var(--panel2);
  border:1px solid var(--rc,var(--line));
  border-radius:10px;
  padding:10px;
  cursor:pointer;
  position:relative;
}
.mini-card.ss{
  border-image:linear-gradient(120deg,#ff5a3c,#ffd93c,#4cd97b,#3ca7ff,#9b5cff,#ff6fd8) 1;
}
.mini-card .name{font-size:11px;font-weight:700;margin-bottom:4px;}
.mini-card .elem{font-size:9px;color:var(--muted);margin-bottom:6px;}
.mini-pixel{display:flex;justify-content:center;margin-bottom:6px;}
.mini-rarity{font-size:8px;color:var(--rc,var(--muted));letter-spacing:1px;}
.mini-delete{
  position:absolute;
  top:4px;right:4px;
  width:26px;height:26px;
  border-radius:50%;
  background:rgba(5,8,16,0.85);
  border:1px solid var(--line);
  color:var(--muted);
  font-size:14px;
  line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  z-index:2;
}
.mini-elem-badge{
  position:absolute;
  top:4px;left:4px;
  width:24px;height:24px;
  border-radius:50%;
  background:var(--ec);
  border:1.5px solid rgba(0,0,0,0.35);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;
  font-weight:700;
  color:#0B0F1A;
  box-shadow:0 0 6px var(--ec);
  z-index:2;
}
.mini-delete:hover{color:var(--magenta);border-color:var(--magenta);}
.empty{color:var(--muted);font-size:11px;text-align:center;padding:30px 10px;line-height:1.8;}
.collection-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.collection-head .count{font-size:11px;color:var(--green);}
.filter-row{display:flex;gap:8px;margin-bottom:12px;}
.filter-row select{
  flex:1;
  background:#050810;
  border:1px solid var(--line);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  padding:8px;
  border-radius:6px;
}

/* battle */
select{
  width:100%;
  background:#050810;
  border:1px solid var(--line);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  padding:10px;
  border-radius:6px;
}
.fighter-pick{display:flex;align-items:center;gap:8px;margin-bottom:0;}
.vs-mini{
  font-family:'Press Start 2P',monospace;
  color:var(--magenta);
  font-size:10px;
  flex-shrink:0;
}
.battle-log{
  background:#050810;
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px;
  font-size:10.5px;
  line-height:1.9;
  max-height:140px;
  overflow-y:auto;
  color:var(--muted);
  margin-top:12px;
}
.battle-log .win{color:var(--amber);font-weight:700;}

/* arena */
.arena{
  position:relative;
  height:224px;
  margin-top:16px;
  border-radius:10px;
  border:1px solid var(--line);
  background:
    radial-gradient(circle at 50% 20%, rgba(255,61,129,0.10), transparent 55%),
    linear-gradient(180deg, #101a33 0%, #060a16 75%);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 18px;
  overflow:hidden;
}
.arena.shake{animation:arenaShake .55s;}
.arena-watermark{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Press Start 2P',monospace;
  font-size:13px;
  line-height:1.9;
  color:var(--muted);
  opacity:.16;
  text-align:center;
  letter-spacing:2px;
  pointer-events:none;
  user-select:none;
  transform:rotate(-3deg);
}
@keyframes arenaShake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-11px);}
  50%{transform:translateX(11px);}
  75%{transform:translateX(-6px);}
}
.floor{
  position:absolute;
  left:0;right:0;bottom:34px;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
}
.fighter{
  width:42%;
  height:190px;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  transition:transform .38s ease;
}
.fighter.right{align-items:center;}
.fighter.right .sprite-wrap .pixel-grid{transform:scaleX(-1);}
.fighter.lunge-l{transform:translateX(28px);}
.fighter.lunge-r{transform:translateX(-28px);}
.fighter.shakehit{animation:hitshake .55s;}
@keyframes hitshake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-16px);}
  40%{transform:translateX(16px);}
  60%{transform:translateX(-10px);}
  80%{transform:translateX(10px);}
}
.fx-zone{
  width:100%;
  height:56px;
  flex-shrink:0;
  position:relative;
}
.sprite-wrap{
  flex:1;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  transition:filter .1s ease;
}
.sprite-wrap.flash{filter:brightness(2.4) saturate(1.4);}
.sprite-wrap .pixel-grid{padding:0;background:transparent;border:none;}
.info-zone{
  width:100%;
  flex-shrink:0;
  padding-top:6px;
}
.fname{font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}
.hpwrap{width:100%;}
.hpbar{height:7px;background:#050810;border-radius:4px;overflow:hidden;border:1px solid var(--line);}
.hpfill{height:100%;background:var(--green);transition:width .35s ease;}
.dmg-pop{
  position:absolute;
  bottom:2px;left:50%;
  transform:translateX(-50%);
  font-family:'Press Start 2P',monospace;
  font-size:12px;
  color:var(--amber);
  text-shadow:0 0 6px rgba(255,194,71,0.6);
  pointer-events:none;
  animation:dmgFloat 1.4s ease-out forwards;
  z-index:5;
}
@keyframes dmgFloat{
  0%{opacity:1;transform:translateX(-50%) translateY(0);}
  100%{opacity:0;transform:translateX(-50%) translateY(-26px);}
}
.particle{
  position:absolute;
  width:5px;height:5px;
  top:50%;left:50%;
  border-radius:1px;
  pointer-events:none;
  animation:particleBurst .9s ease-out forwards;
  z-index:4;
}
@keyframes particleBurst{
  0%{opacity:1;transform:translate(0,0) scale(1);}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3);}
}
.win-glow{animation:winGlow 1s ease-in-out infinite;}
@keyframes winGlow{
  0%,100%{filter:brightness(1);}
  50%{filter:brightness(1.8) drop-shadow(0 0 8px var(--amber));}
}
.arena-flash{
  position:absolute;inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
  z-index:6;
}
.arena-flash.go{animation:flashPulse .4s ease-out;}
@keyframes flashPulse{
  0%{opacity:.8;}
  100%{opacity:0;}
}
.dmg-pop.special{
  font-size:16px;
  color:var(--magenta);
  text-shadow:0 0 10px rgba(255,61,129,0.8);
}
.dmg-pop.miss{
  font-size:13px;
  color:var(--muted);
  text-shadow:none;
}
.dmg-pop.status{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  font-weight:700;
  text-shadow:0 0 6px rgba(0,0,0,0.6);
}
.tech-pop{
  position:absolute;
  top:2px;left:50%;
  transform:translateX(-50%);
  font-family:'Press Start 2P',monospace;
  font-size:10px;
  color:var(--amber);
  text-shadow:0 0 10px rgba(255,194,71,0.8);
  white-space:nowrap;
  pointer-events:none;
  animation:techPop 1s ease-out forwards;
  z-index:7;
}
@keyframes techPop{
  0%{opacity:0;transform:translateX(-50%) scale(.5);}
  25%{opacity:1;transform:translateX(-50%) scale(1.1);}
  75%{opacity:1;transform:translateX(-50%) scale(1);}
  100%{opacity:0;transform:translateX(-50%) translateY(-10px) scale(1);}
}
.sprite-wrap.special-glow{animation:specialGlow .5s ease;}
@keyframes specialGlow{
  0%,100%{filter:brightness(1);}
  50%{filter:brightness(2.6) drop-shadow(0 0 10px var(--magenta));}
}
.fx-slash{
  position:absolute;
  top:50%;left:50%;
  width:80px;height:5px;
  background:linear-gradient(90deg, transparent, #fff 20%, #fff 80%, transparent);
  transform:translate(-50%,-50%) rotate(var(--angle,-32deg)) scaleX(0);
  transform-origin:center;
  pointer-events:none;
  z-index:8;
  animation:slashAnim .4s ease-out forwards;
  box-shadow:0 0 6px rgba(255,255,255,0.8);
}
@keyframes slashAnim{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--angle,-32deg)) scaleX(0);}
  25%{opacity:1;transform:translate(-50%,-50%) rotate(var(--angle,-32deg)) scaleX(1);}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--angle,-32deg)) scaleX(1.25);}
}
.fx-beam{
  position:absolute;
  top:-24px;left:50%;
  width:9px;height:0;
  background:linear-gradient(180deg, rgba(255,255,255,0), var(--beam-color,#fff));
  transform:translateX(-50%);
  pointer-events:none;
  z-index:8;
  box-shadow:0 0 14px var(--beam-color,#fff);
  animation:beamAnim .4s ease-in forwards;
}
@keyframes beamAnim{
  0%{height:0;opacity:.9;top:-30px;}
  55%{height:80px;opacity:1;top:-6px;}
  100%{height:80px;opacity:0;top:4px;}
}
.fx-explosion{
  position:absolute;
  top:50%;left:50%;
  width:12px;height:12px;
  border-radius:50%;
  background:radial-gradient(circle, #fff, var(--exp-color,#ff5a3c) 45%, transparent 72%);
  transform:translate(-50%,-50%) scale(0);
  pointer-events:none;
  z-index:8;
  animation:explosionAnim .55s ease-out forwards;
}
@keyframes explosionAnim{
  0%{opacity:1;transform:translate(-50%,-50%) scale(0);}
  35%{opacity:1;transform:translate(-50%,-50%) scale(1.4);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2);}
}
.result-label{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.3) rotate(-8deg);
  font-family:'Press Start 2P',monospace;
  font-size:22px;
  opacity:0;
  pointer-events:none;
  z-index:9;
  white-space:nowrap;
}
.result-label.show{animation:resultPop .5s cubic-bezier(.2,.9,.3,1.4) forwards;}
@keyframes resultPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg);}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(3deg);}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg);}
}
.result-label.win{
  color:#fff;
  text-shadow:
    -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
    -2px 0 0 #000, 2px 0 0 #000, 0 -2px 0 #000, 0 2px 0 #000,
    0 0 16px var(--amber);
}
.result-label.lose{
  color:#c7cee6;
  text-shadow:
    -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
    -2px 0 0 #000, 2px 0 0 #000, 0 -2px 0 #000, 0 2px 0 #000,
    0 0 10px rgba(0,0,0,0.6);
}

/* title screen */
.title-screen{
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 50% 30%, rgba(57,255,136,0.10), transparent 50%),
    radial-gradient(circle at 50% 90%, rgba(255,61,129,0.08), transparent 50%),
    var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:100;
  cursor:pointer;
  padding:20px;
  text-align:center;
}
.title-logo{
  max-width:min(88vw, 420px);
  width:100%;
  height:auto;
  image-rendering:pixelated;
  filter:drop-shadow(0 4px 18px rgba(0,0,0,0.5));
}
.title-bars{display:flex;gap:2px;height:30px;margin:22px 0;}
.title-bars span{width:3px;background:var(--green);opacity:.85;}
.title-sub2{color:var(--muted);font-size:11px;letter-spacing:2px;}
.title-tap{
  margin-top:46px;
  font-size:11px;
  color:var(--amber);
  letter-spacing:1px;
  animation:blinkTap 1.1s steps(1) infinite;
}
@keyframes blinkTap{0%,49%{opacity:1;}50%,100%{opacity:0;}}

/* ========== PC受付端末 追加スタイル ========== */
html,body{overflow-x:hidden;}
body{padding:24px;}
.app-shell{max-width:1360px;margin:0 auto;}
.app-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:12px;
}
.app-logo{
  font-family:'Press Start 2P',monospace;
  font-size:15px;
  color:var(--green);
  text-shadow:0 0 12px rgba(57,255,136,0.4);
  letter-spacing:1px;
}
.app-logo span{
  display:block;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--muted);
  letter-spacing:3px;
  margin-top:4px;
}
.champion-banner{
  padding:10px 20px;
  border-radius:10px;
  background:var(--panel2);
  border:1px solid var(--line);
  font-size:13px;
  color:var(--muted);
  letter-spacing:.5px;
}
.champion-banner.has-champion{
  color:var(--amber);
  border-color:var(--amber);
  box-shadow:0 0 14px rgba(255,194,71,0.25) inset;
}
.champion-banner b{color:var(--text);}

.layout{
  display:flex;
  gap:22px;
  align-items:flex-start;
}
.reception-panel{
  width:340px;
  flex-shrink:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:20px;
}
.reception-panel h2{
  font-size:13px;
  letter-spacing:3px;
  color:var(--green);
  margin:0 0 14px;
}
.reception-panel h3{
  font-size:11px;
  color:var(--muted);
  letter-spacing:1px;
  margin:20px 0 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.reception-panel h3 span{color:var(--green);font-weight:700;}
.queue-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:360px;
  overflow-y:auto;
  padding-right:2px;
}
.queue-empty{color:var(--muted);font-size:11px;text-align:center;padding:20px 8px;line-height:1.7;}
.queue-item{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:7px 9px;
  font-size:11.5px;
}
.qi-badge{
  width:24px;height:24px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
  color:#0B0F1A;
  flex-shrink:0;
}
.qi-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qi-pwr{color:var(--amber);font-size:10.5px;flex-shrink:0;}

.arena-stage{flex:1;min-width:0;}

/* PC向けにアリーナを大きく */
.arena{height:400px;margin-top:0;}
.fighter{height:340px;}
.fx-zone{height:70px;}
.fname{font-size:13px;}
.hpbar{height:9px;}
.card-power{display:none;} /* このアプリでは未使用 */
.result-label{font-size:30px;}
.tech-pop{font-size:12px;}
.dmg-pop{font-size:15px;}
.arena-watermark{font-size:16px;}

.reset-btn-row{margin-top:10px;}


/* ========== PC受付端末 3フェーズ・キオスクUI ========== */
html,body{height:100%;overflow:hidden;}
body{padding:0;}
.kiosk-frame{height:100vh;display:flex;flex-direction:column;position:relative;}
.kiosk-scanlines{
  position:fixed;inset:0;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 3px);
  pointer-events:none;
  z-index:999;
  animation:kioskScanDrift 7s linear infinite;
}
@keyframes kioskScanDrift{
  0%{background-position:0 0;}
  100%{background-position:0 40px;}
}
.kiosk-logo-bar{
  flex-shrink:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(57,255,136,0.05), transparent);
}
.kiosk-logo{height:50px;width:auto;image-rendering:pixelated;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));}

.phase-stage{flex:1;min-height:0;position:relative;}
.phase{
  position:absolute;inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px 30px;
  overflow:auto;
}
.phase.hidden{display:none;}

/* --- 受付フェーズ --- */
.reception-center{width:100%;max-width:620px;}
.reception-center .champion-banner{
  width:100%;
  box-sizing:border-box;
  text-align:center;
  font-size:16px;
  padding:14px 20px;
  margin-bottom:18px;
}
.reception-center #barcodeInput{font-size:18px;}
.reception-center .btn-primary{font-size:14px;padding:15px 10px;}
.reception-center h3{font-size:13px;margin:20px 0 10px;color:var(--muted);letter-spacing:1px;display:flex;justify-content:space-between;}
.reception-center h3 span{color:var(--green);font-weight:700;}
.reception-center .queue-list{max-height:min(30vh,280px);}
.reception-center #resetBtn{margin-top:8px;}

/* --- 対戦フェーズ(スマホ版より誇張) --- */
.phase-battle .arena{width:100%;max-width:1150px;height:min(66vh,600px);margin-top:0;}
.phase-battle .fighter{height:calc(100% - 14px);}
.phase-battle .fx-zone{height:90px;}
.phase-battle .fname{font-size:16px;}
.phase-battle .hpbar{height:11px;}
.phase-battle .battle-log{max-width:1150px;width:100%;margin-top:10px;max-height:120px;}

/* --- 結果フェーズ --- */
.result-showcase{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.result-ambient{position:absolute;inset:-100px;pointer-events:none;z-index:0;}
.result-particle{
  position:absolute;top:50%;left:50%;
  width:9px;height:9px;
  border-radius:50%;
  animation:resultBurst 1.4s ease-out forwards;
}
@keyframes resultBurst{
  0%{opacity:1;transform:translate(0,0) scale(1);}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2);}
}
.result-crown{
  font-size:56px;
  animation:crownBounce 1s ease-in-out infinite;
  z-index:1;
}
@keyframes crownBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.result-badge{
  font-family:'Press Start 2P',monospace;
  font-size:13px;
  color:var(--rc,var(--amber));
  border:2px solid var(--rc,var(--amber));
  border-radius:20px;
  padding:6px 18px;
  margin:8px 0 14px;
  z-index:1;
  letter-spacing:1px;
}
.result-canvas-frame{
  background:#050810;
  border:8px solid var(--rc,var(--amber));
  border-radius:16px;
  padding:14px;
  z-index:1;
  animation:resultGlow 1.6s ease-in-out infinite;
}
.result-canvas-frame.ss{
  border-image:linear-gradient(120deg,#ff5a3c,#ffd93c,#4cd97b,#3ca7ff,#9b5cff,#ff6fd8) 1;
}
#resultCanvas{image-rendering:pixelated;display:block;}
@keyframes resultGlow{
  0%,100%{box-shadow:0 0 30px rgba(255,194,71,.45);}
  50%{box-shadow:0 0 70px rgba(255,194,71,.85);}
}
.result-name{
  font-family:'Press Start 2P',monospace;
  font-size:40px;
  color:#fff;
  margin-top:20px;
  text-align:center;
  z-index:1;
  text-shadow:
    -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
    -3px 0 0 #000, 3px 0 0 #000, 0 -3px 0 #000, 0 3px 0 #000,
    0 0 24px var(--amber);
}
.result-streak{
  font-size:20px;
  color:var(--amber);
  margin-top:12px;
  letter-spacing:1px;
  z-index:1;
  text-shadow:0 0 10px rgba(255,194,71,.6);
}
.result-countdown{
  position:absolute;
  bottom:18px;
  left:0;right:0;
  text-align:center;
  font-size:11px;
  color:var(--muted);
  letter-spacing:1px;
}

/* --- 対戦エフェクトをスマホ版より誇張 --- */
.dmg-pop{font-size:26px !important;}
.dmg-pop.special{font-size:38px !important;}
.dmg-pop.miss{font-size:22px !important;}
.dmg-pop.status{font-size:18px !important;}
.tech-pop{font-size:18px !important;}
.particle{width:8px;height:8px;}
.fx-slash{width:140px;height:9px;}
.fx-beam{width:16px;}
.fx-explosion{width:20px;height:20px;}
.result-label{font-size:52px !important;}

<script>


/* ---------- deterministic generation ---------- */
function hashCode(str){
  let h = 0;
  for(let i=0;i<str.length;i++){
    h = (Math.imul(31,h) + str.charCodeAt(i)) >>> 0;
  }
  return h >>> 0;
}
function mulberry32(seed){
  let a = seed;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const ELEMENTS = [
  {name:"炎",color:"#FF5A3C"},
  {name:"水",color:"#3CA7FF"},
  {name:"草",color:"#4CD97B"},

const RARITY = [

  {key:"C",label:"アンコモン",color:"#4CD97B",max:190},
  {key:"B",label:"レア",color:"#3CA7FF",max:230},
  {key:"A",label:"スーパーレア",color:"#9B5CFF",max:270},

  {key:"SS",label:"レジェンド",color:"#FF6FD8",max:Infinity},

const SYL = ["ガ","ギ","グ","ゲ","ゴ","ザ","ジ","ズ","ゼ","ゾ","ダ","ヂ","ヅ","デ","ド","バ","ビ","ブ","ベ","ボ","パ","ピ","プ","ペ","ポ","カ","キ","ク","ケ","コ","サ","シ","ス","セ","ソ","タ","チ","ツ","テ","ト","ナ","ニ","ヌ","ネ","ノ","ラ","リ","ル","レ","ロ","マ","ミ","ム","メ","モ"];

function rarityFor(total){
  return RARITY.find(r => total <= r.max);
}

/* ---------- part library ----------
   これはプレースホルダー。将来はワークショップ参加者が描いた
   実際のドット絵パーツ(頭/体/尻尾)に差し替え・追加していく想定。
   各パーツは半分の幅(4マス)のビットマップで、左右反転して合成する。
   配列に新しいパーツを増やすだけで、組み合わせ数がどんどん膨らむ。
*/
/* ---------- 9-slot part system (3x3 grid of tiles) ----------
   これはプレースホルダー。将来はワークショップ参加者が32px四方で描いた
   実際のドット絵パーツ(9枚 = 3x3配置)に差し替える設計になっている。
   今はまだ実素材が無いので、6種類の「役割」(上段/中段/下段 × 中央/側面)
   ごとに手続き生成したタイルを用意し、側面は左右反転して使うことで
   9枠すべてを埋めている。実素材が揃ったら、この生成ロジックを
   Google Drive上のPNG(タイル単位の画像)に丸ごと差し替えられる。
*/
const TILE_SIZE = 8; // 32px実素材1枚に対応する仮想解像度(プレースホルダー用)
const VARIANTS_PER_ROLE = 5;

function generateTilePattern(seedStr, symmetric){
  const rng = mulberry32(hashCode(seedStr));
  const w = TILE_SIZE, h = TILE_SIZE;
  const cy = (h-1)/2;
  if(symmetric){
    const half = Math.ceil(w/2);
    const rowsHalf = [];
    for(let y=0;y<h;y++){
      const row = [];
      for(let x=0;x<half;x++){
        const dx = (x-(half-0.5))/half, dy = (y-cy)/h;
        const dist = Math.sqrt(dx*dx+dy*dy);
        row.push(rng() < Math.max(0.05, 0.9 - dist*1.0));
      }
      rowsHalf.push(row);
    }
    return rowsHalf.map(row => row.concat(row.slice().reverse()));
  }
  const rows = [];
  for(let y=0;y<h;y++){
    const row = [];
    for(let x=0;x<w;x++){
      const dx = (x-(w-1)*0.7)/w, dy = (y-cy)/h;
      const dist = Math.sqrt(dx*dx+dy*dy);
      row.push(rng() < Math.max(0.05, 0.9 - dist*1.0));
    }
    rows.push(row);
  }
  return rows;
}

const TILE_LIBRARY = {};
["topC","midC","botC"].forEach(role=>{
  TILE_LIBRARY[role] = [];
  for(let v=0; v<VARIANTS_PER_ROLE; v++) TILE_LIBRARY[role].push(generateTilePattern("lib_"+role+"_"+v, true));
});
["topS","midS","botS"].forEach(role=>{
  TILE_LIBRARY[role] = [];
  for(let v=0; v<VARIANTS_PER_ROLE; v++) TILE_LIBRARY[role].push(generateTilePattern("lib_"+role+"_"+v, false));
});

function mirrorTileH(tile){
  return tile.map(row => row.slice().reverse());
}

function pickTileVariant(role, barcode){
  return hashCode(barcode + "_" + role) % TILE_LIBRARY[role].length;
}

function shadeColor(hex, percent){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, (n >> 16) + Math.round(255*percent)));
  const g = Math.min(255, Math.max(0, ((n >> 8) & 0xFF) + Math.round(255*percent)));
  const b = Math.min(255, Math.max(0, (n & 0xFF) + Math.round(255*percent)));
  return "#" + [r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}

function pickPartIndices(barcode){
  return {
    topC: pickTileVariant("topC", barcode), topS: pickTileVariant("topS", barcode),
    midC: pickTileVariant("midC", barcode), midS: pickTileVariant("midS", barcode),
    botC: pickTileVariant("botC", barcode), botS: pickTileVariant("botS", barcode),
  };
}

const SLOT_NAMES = ["topC","topS","midC","midS","botC","botS"];

function emptyColorTile(size){
  return Array.from({length:size}, ()=> Array(size).fill(null));
}

function boolTileToColor(boolTile, color){
  return boolTile.map(row => row.map(on => on ? color : null));
}

/* ---------- 実素材(32px×3×3)からの合成 ----------
   ドット制作アプリ側の「全パーツドットデータ(JSON)」は
   { head, body, legs, top_side, mid_side, bot_side } の6キーで、
   それぞれ32×32のマス目(色コード文字列 or null)。
   head/body/legs は中央列、*_side は右側列に使い、左側列は反転して使う。
*/
const EMPTY_TILE_32 = emptyColorTile(32);

function normalizeTile32(tile){
  if(Array.isArray(tile) && tile.length === 32 && Array.isArray(tile[0])) return tile;
  return EMPTY_TILE_32;
}

function buildColorGridFromDotData(dotData){
  const d = dotData || {};
  const headC = normalizeTile32(d.head);
  const bodyC = normalizeTile32(d.body);
  const legsC = normalizeTile32(d.legs);
  const topR = normalizeTile32(d.top_side), topL = mirrorTileH(topR);
  const midR = normalizeTile32(d.mid_side), midL = mirrorTileH(midR);
  const botR = normalizeTile32(d.bot_side), botL = mirrorTileH(botR);

  const rowsDef = [
    [topL, headC, topR],
    [midL, bodyC, midR],
    [botL, legsC, botR],
  ];
  const grid = [];
  rowsDef.forEach(tiles=>{
    for(let y=0;y<32;y++){
      grid.push(tiles[0][y].concat(tiles[1][y], tiles[2][y]));
    }
  });
  return grid;
}

/* ---------- 実パーツプール(ワークショップ蓄積データ)のキャッシュ ----------
   GASの ?all=1 から、登録されている全作品のドットデータをまとめて取得し、
   スロットごと(head/body/legs/top_side/mid_side/bot_side)のプールに分けて貯めておく。
   取得できなければ null のままとし、その場合は手続き生成のプレースホルダーにフォールバックする。
*/
const SLOT_TO_KEY = { topC:"head", midC:"body", botC:"legs", topS:"top_side", midS:"mid_side", botS:"bot_side" };
let partPool = null;
let partPoolLoading = null;

async function loadPartPool(){
  if(partPoolLoading) return partPoolLoading;
  partPoolLoading = (async ()=>{
    try{
      if(GAS_ENDPOINT_URL === "YOUR_GAS_WEBAPP_URL_HERE") throw new Error("GAS_ENDPOINT_URL 未設定");
      const res = await fetch(GAS_ENDPOINT_URL + "?all=1");
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const items = Array.isArray(data) ? data : (data.items || []);
      const pool = { topC:[], topS:[], midC:[], midS:[], botC:[], botS:[] };
      items.forEach(item=>{
        let dd = item.dotData ?? item["全パーツドットデータ(JSON)"] ?? item.dot_data;
        if(typeof dd === "string"){ try{ dd = JSON.parse(dd); }catch(e){ dd = null; } }
        if(!dd) return;
        SLOT_NAMES.forEach(slot=>{
          const key = SLOT_TO_KEY[slot];
          const tile = normalizeTile32(dd[key]);
          if(tile !== EMPTY_TILE_32) pool[slot].push(tile);
        });
      });
      const complete = SLOT_NAMES.every(slot => pool[slot].length > 0);
      partPool = complete ? pool : null;
    }catch(err){
      console.warn("実パーツプールの読み込みに失敗、手続き生成にフォールバックします:", err);
      partPool = null;
    }finally{
      // 完了したら次回呼び出しで必ず再取得できるようにリセットする
      partPoolLoading = null;
    }
    return partPool;
  })();
  return partPoolLoading;
}

const PART_POOL_REFRESH_MS = 45000; // ワークショップ中に増えるパーツを拾うため定期的に再取得
setInterval(()=>{ loadPartPool(); }, PART_POOL_REFRESH_MS);
function shadeColor(hex, percent){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, (n >> 16) + Math.round(255*percent)));
  const g = Math.min(255, Math.max(0, ((n >> 8) & 0xFF) + Math.round(255*percent)));
  const b = Math.min(255, Math.max(0, (n & 0xFF) + Math.round(255*percent)));
  return "#" + [r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}

/* ---------- パーツ充足度 × 色違いでレア度を決めるごちゃまぜ合成 ----------
   30% 頭のみ or 頭+体(コモン) / 30% 頭+体+足・センターのみ(レア) /
   30% サイドパーツまでフルセット(スーパーレア) / 10% それらの色違い(レジェンド・虹色)
*/
function pickMixTier(barcode){
  const rng = mulberry32(hashCode(barcode + "_tier"));
  const roll = rng();
  const shiny = roll >= 0.85; // 色違い確率(15%)
  let tier = shiny ? "full" : (roll < 0.30 ? "sparse" : roll < 0.60 ? "core" : "full");
  let sparseVariant = null;
  if(tier === "sparse") sparseVariant = rng() < 0.5 ? "head" : "headbody";
  return { tier, sparseVariant, shiny };
}

function slotsFilledForTier(tier, sparseVariant){
  if(tier === "sparse"){
    return sparseVariant === "head"
      ? { topC:true }
      : { topC:true, midC:true };
  }
  if(tier === "core") return { topC:true, midC:true, botC:true };
  return { topC:true, topS:true, midC:true, midS:true, botC:true, botS:true }; // full
}

function buildMixCreatureGrid(barcode, elementColor){
  const { tier, sparseVariant, shiny } = pickMixTier(barcode);
  const filled = slotsFilledForTier(tier, sparseVariant);
  const usingReal = !!partPool;
  const tileSize = usingReal ? 32 : TILE_SIZE;

  const tiles = {};
  SLOT_NAMES.forEach(slot=>{
    if(!filled[slot]){
      tiles[slot] = emptyColorTile(tileSize);
      return;
    }
    if(usingReal){
      const pool = partPool[slot];
      tiles[slot] = pool[hashCode(barcode+"_"+slot+"_pool") % pool.length];
    } else {
      const idx = pickTileVariant(slot, barcode);
      const shade = slot.startsWith("top") ? 0.18 : slot.startsWith("bot") ? -0.18 : 0;
      tiles[slot] = boolTileToColor(TILE_LIBRARY[slot][idx], shadeColor(elementColor, shade));
    }
  });

  const topL = mirrorTileH(tiles.topS), midL = mirrorTileH(tiles.midS), botL = mirrorTileH(tiles.botS);
  const rowsDef = [
    [topL, tiles.topC, tiles.topS],
    [midL, tiles.midC, tiles.midS],
    [botL, tiles.botC, tiles.botS],
  ];
  const grid = [];
  rowsDef.forEach(rowTiles=>{
    for(let y=0;y<tileSize;y++){
      grid.push(rowTiles[0][y].concat(rowTiles[1][y], rowTiles[2][y]));
    }
  });

  const TIER_LABEL = { sparse: sparseVariant === "head" ? "ヘッドのみ" : "ヘッド+ボディ", core: "コア(頭・体・足)", full: "フルセット" };
  const rarityBySlotTier = shiny ? RARITY[5] /* SS レジェンド */
    : tier === "sparse" ? RARITY[0] /* D コモン */
    : tier === "core" ? RARITY[2] /* B レア */
    : RARITY[3]; /* A スーパーレア */

  return { grid, tierLabel: TIER_LABEL[tier], shiny, usingReal, rarity: rarityBySlotTier };
}

function coreStatsFromBarcode(barcode){
  const rng = mulberry32(hashCode(barcode));
  const element = ELEMENTS[Math.floor(rng()*ELEMENTS.length)];
  const hp = Math.floor(20 + rng()*70);
  const atk = Math.floor(20 + rng()*70);
  const def = Math.floor(20 + rng()*70);
  const spd = Math.floor(20 + rng()*70);
  const total = hp+atk+def+spd;
  let name = "";
  for(let i=0;i<3;i++) name += SYL[Math.floor(rng()*SYL.length)];
  name += SUFFIX[Math.floor(rng()*SUFFIX.length)];
  return { element, hp, atk, def, spd, total, name };
}

/* ごちゃまぜ合成モード：バーコードのハッシュからパーツ・ステータス・レア度を自動生成 */
function generateRandomMixMonster(barcode){
  const core = coreStatsFromBarcode(barcode);
  const { grid, tierLabel, shiny, usingReal, rarity } = buildMixCreatureGrid(barcode, core.element.color);
  return {
    id: barcode,
    barcode, name: core.name, element: core.element.name, color: core.element.color,
    hp: core.hp, atk: core.atk, def: core.def, spd: core.spd, total: core.total,
    rarityKey: rarity.key, rarityLabel: rarity.label, rarityColor: rarity.color,
    grid, parts: { tierLabel, shiny, usingReal }, capturedAt: Date.now(), original: false
  };
}

/* 作成者確定モード：スプレッドシート(GAS経由)に登録された実際のドット絵(32px×3×3)で組み立てる。
   ステータス/名前/属性はこれまで通りバーコードのハッシュから決定し、
   見た目(パーツ)だけをGASから取得した実データで上書きする。
   ここでも10%の確率で「色違い(レジェンド)」になる。 */

// ⚠ ここを実際に公開したGASウェブアプリのURL(/exec で終わるもの)に差し替えてください
const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbwT-bfcyLjMgTtR_V8MpFuzxu-6UjWoO_pcQGIbQ39PVWEd6DiCT8GY9KLlUqEzMNma6A/exec";

function buildMonsterFromOriginalRow(barcode, row){
  const core = coreStatsFromBarcode(barcode);
  let dotData = row.dotData ?? row["全パーツドットデータ(JSON)"] ?? row.dot_data;
  if(typeof dotData === "string"){
    try{ dotData = JSON.parse(dotData); }catch(e){ dotData = null; }
  }
  const grid = buildColorGridFromDotData(dotData);
  const shinyRng = mulberry32(hashCode(barcode + "_orig_shiny"));
  const shiny = shinyRng() < 0.15; // 色違い確率(15%)
  const rarity = shiny ? RARITY[5] : rarityFor(core.total);
  return {
    id: barcode,
    barcode, name: row.name || row["作品名"] || core.name,
    element: core.element.name, color: core.element.color,
    hp: core.hp, atk: core.atk, def: core.def, spd: core.spd, total: core.total,
    rarityKey: rarity.key, rarityLabel: rarity.label, rarityColor: rarity.color,
    grid, parts: { tierLabel: "フルセット", shiny, usingReal: true }, capturedAt: Date.now(), original: true
  };
}

async function loadOriginalMonster(barcode){
  try{
    if(GAS_ENDPOINT_URL === "YOUR_GAS_WEBAPP_URL_HERE") throw new Error("GAS_ENDPOINT_URL 未設定");
    const res = await fetch(GAS_ENDPOINT_URL + "?barcode=" + encodeURIComponent(barcode));
    if(!res.ok) throw new Error("HTTP " + res.status);
    const row = await res.json();
    if(!row || row.found === false) throw new Error("該当データなし: " + barcode);
    return buildMonsterFromOriginalRow(barcode, row);
  }catch(err){
    console.warn("作成者確定モードの読み込みに失敗、ごちゃまぜ合成にフォールバックします:", err);
    return generateRandomMixMonster(barcode);
  }
}


/* ---------- render helpers ---------- */
// grid: 配列(行) × 配列(列) の色コード文字列 or null。
// targetWidth: 表示したい全体の横幅(px)。解像度(24マス/96マスなど)に関わらず見た目のサイズを揃える。
function renderColorGrid(canvas, grid, targetWidth){
  const rows = grid.length;
  const cols = grid[0].length;
  const cellSize = targetWidth / cols;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(cols * cellSize * dpr);
  canvas.height = Math.round(rows * cellSize * dpr);
  canvas.style.width = (cols * cellSize) + "px";
  canvas.style.height = (rows * cellSize) + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cols*cellSize, rows*cellSize);
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      const c = grid[y][x];
      if(c){
        ctx.fillStyle = c;
        ctx.fillRect(x*cellSize, y*cellSize, cellSize+0.6, cellSize+0.6);
      }
    }
  }
  canvas._cgMeta = { grid, cellSize };
}

const ARENA_TARGET_W = 280; // PC受付端末は大画面向けに大きめ表示（誇張演出）

const STATUS_COLORS = { "やけど":"#FF5A3C", "毒":"#4CD97B", "怪我":"#FF3D81", "流血":"#FF3D81" };

function fadeOutLoser(side, monster){
  const canvas = document.getElementById("pg"+side);
  if(!canvas || !monster || !canvas._cgMeta) return;
  const { grid, cellSize } = canvas._cgMeta;
  const rows = grid.length;
  const cols = grid[0].length;
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;

  const draw = (visibleRows)=>{
    ctx.clearRect(0, 0, cols*cellSize, rows*cellSize);
    for(let y=0; y<visibleRows; y++){
      for(let x=0; x<cols; x++){
        const c = grid[y][x];
        if(c){
          ctx.fillStyle = c;
          ctx.fillRect(x*cellSize, y*cellSize, cellSize+0.6, cellSize+0.6);
        }
      }
    }
  };

  let visibleRows = rows;
  const timer = setInterval(()=>{
    visibleRows--;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(Math.max(0, visibleRows));
    if(visibleRows <= 0) clearInterval(timer);
  }, Math.max(12, Math.floor(500/rows)));
}

const TECH_SUFFIX = ["ブレイク","バースト","ストライク","インパクト","フレア","クラッシュ","タイフーン","ボルテックス","メテオ","レイジ"];
function buildTechName(monster){
  return monster.element + "・" + TECH_SUFFIX[Math.floor(Math.random()*TECH_SUFFIX.length)];
}

function runBattle(a, b, onComplete){
  const log = document.getElementById("battleLog");
  const arena = document.getElementById("arena");
  log.classList.remove("hidden");
  log.innerHTML = "";
  document.getElementById("fighterL").classList.remove("win-glow");
  document.getElementById("fighterR").classList.remove("win-glow");
  ["resultL","resultR"].forEach(id=>{
    const el = document.getElementById(id);
    el.className = "result-label";
    el.textContent = "";
  });

  renderArenaFighter("L", a);
  renderArenaFighter("R", b);

  let hpA = a.hp*6, hpB = b.hp*6;
  const maxA = hpA, maxB = hpB;

  const turns = [];
  let first = a.spd >= b.spd ? [a,b,true] : [b,a,false];
  let guardHpA = hpA, guardHpB = hpB;
  let round = 1;
  const statusA = { burn:false, poison:false, injuryPending:false, bleedPending:false };
  const statusB = { burn:false, poison:false, injuryPending:false, bleedPending:false };
  const kindsPool = ["slash","beam","explosion"];

  outer:
  while(guardHpA > 0 && guardHpB > 0 && round < 60){
    const [att, def, attIsA] = first;
    const attStatus = attIsA ? statusA : statusB;
    const defStatus = attIsA ? statusB : statusA;

    // PRE: injury tick (before own turn starts)
    if(attStatus.injuryPending){
      const dmg = 5;
      if(attIsA) guardHpA -= dmg; else guardHpB -= dmg;
      turns.push({type:"status", isA:attIsA, label:"怪我", amount:dmg, guardHpA:Math.max(0,guardHpA), guardHpB:Math.max(0,guardHpB), round});
      attStatus.injuryPending = false;
      if(guardHpA<=0 || guardHpB<=0) break outer;
    }

    // MAIN attack
    const isMiss = Math.random() < 0.10;
    let isSpecial = false, dmg = 0, kind = null;
    if(!isMiss){
      isSpecial = Math.random() < 0.18;
      dmg = Math.max(6, Math.round((att.atk - def.def*0.4) * (0.85 + Math.random()*0.3)));
      if(isSpecial) dmg = Math.round(dmg * 2.3);
      if(attIsA) guardHpB -= dmg; else guardHpA -= dmg;
      kind = isSpecial ? "explosion" : kindsPool[Math.floor(Math.random()*kindsPool.length)];

      if(att.element === "炎" && !defStatus.burn && Math.random() < 0.05) defStatus.burn = true;
      if(att.element === "草" && !defStatus.poison && Math.random() < 0.05) defStatus.poison = true;
      if(kind === "slash" && Math.random() < 0.05){
        defStatus.injuryPending = true;
        if(Math.random() < 0.5) defStatus.bleedPending = true;
      }
    }
    turns.push({
      type:"attack", attIsA, dmg, isSpecial, isMiss, kind,
      techName: isSpecial ? buildTechName(att) : null,
      guardHpA: Math.max(0,guardHpA), guardHpB: Math.max(0,guardHpB), round
    });
    if(guardHpA<=0 || guardHpB<=0) break outer;

    // POST: burn / poison / bleed tick (end of own turn)
    if(attStatus.burn){
      const dmg2 = 5;
      if(attIsA) guardHpA -= dmg2; else guardHpB -= dmg2;
      turns.push({type:"status", isA:attIsA, label:"やけど", amount:dmg2, guardHpA:Math.max(0,guardHpA), guardHpB:Math.max(0,guardHpB), round});
      if(guardHpA<=0 || guardHpB<=0) break outer;
    }
    if(attStatus.poison){
      const dmg3 = 5;
      if(attIsA) guardHpA -= dmg3; else guardHpB -= dmg3;
      turns.push({type:"status", isA:attIsA, label:"毒", amount:dmg3, guardHpA:Math.max(0,guardHpA), guardHpB:Math.max(0,guardHpB), round});
      if(guardHpA<=0 || guardHpB<=0) break outer;
    }
    if(attStatus.bleedPending){
      const dmg4 = 15;
      if(attIsA) guardHpA -= dmg4; else guardHpB -= dmg4;
      turns.push({type:"status", isA:attIsA, label:"流血", amount:dmg4, guardHpA:Math.max(0,guardHpA), guardHpB:Math.max(0,guardHpB), round});
      attStatus.bleedPending = false;
      if(guardHpA<=0 || guardHpB<=0) break outer;
    }

    first = [def, att, !attIsA];
    round++;
  }

  let i = 0;
  function step(){
    if(i >= turns.length){
      const winnerIsA = guardHpA > 0;
      const winner = winnerIsA ? a : b;
      const loser = winnerIsA ? b : a;
      const loserSide = winnerIsA ? "R" : "L";
      document.getElementById(winnerIsA ? "fighterL" : "fighterR").classList.add("win-glow");
      const winEl = document.getElementById(winnerIsA ? "resultL" : "resultR");
      const loseEl = document.getElementById(winnerIsA ? "resultR" : "resultL");
      winEl.textContent = "WIN";
      winEl.classList.add("win","show");
      loseEl.textContent = "LOSE";
      loseEl.classList.add("lose","show");
      fadeOutLoser(loserSide, loser);
      const p = document.createElement("div");
      p.className = "win";
      p.textContent = `🏆 ${winner.name} の勝利！`;
      log.appendChild(p);
      log.scrollTop = log.scrollHeight;
      if(onComplete) setTimeout(()=> onComplete(winner, loser), 400);
      return;
    }
    const t = turns[i];

    if(t.type === "status"){
      const side = t.isA ? "L" : "R";
      spawnStatusPop(side, t.label, t.amount);
      const nameFor = t.isA ? a.name : b.name;
      const line = document.createElement("div");
      line.textContent = `#${t.round} ${nameFor} は${t.label}のダメージ！ ${t.amount} ダメージ`;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
      document.getElementById("hpFillL").style.width = Math.max(0, t.guardHpA/maxA*100)+"%";
      document.getElementById("hpFillR").style.width = Math.max(0, t.guardHpB/maxB*100)+"%";
      i++;
      setTimeout(step, 900);
      return;
    }

    const attSide = t.attIsA ? "L" : "R";
    const defSide = t.attIsA ? "R" : "L";
    const attacker = t.attIsA ? a : b;
    const target = t.attIsA ? b : a;

    // log line
    const line = document.createElement("div");
    line.textContent = t.isMiss
      ? `#${t.round} ${attacker.name} の攻撃！ しかし外れた！`
      : t.isSpecial
      ? `#${t.round} 💥 ${attacker.name} の必殺技「${t.techName}」炸裂！ ${target.name} に ${t.dmg} ダメージ！`
      : `#${t.round} ${attacker.name} の攻撃！ ${target.name} に ${t.dmg} ダメージ`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;

    // lunge in
    document.getElementById("fighter"+attSide).classList.add(attSide === "L" ? "lunge-l" : "lunge-r");
    if(t.isSpecial) spawnTechPop(attSide, t.techName);

    setTimeout(()=>{
      if(t.isMiss){
        spawnMissPop(defSide);
      } else {
        // impact
        document.getElementById("fighter"+defSide).classList.add("shakehit");
        document.getElementById("sprite"+defSide).classList.add(t.isSpecial ? "special-glow" : "flash");
        spawnDamagePop(defSide, t.dmg, t.isSpecial);
        spawnParticles(defSide, attacker.color, t.isSpecial ? 32 : 14);
        spawnHitEffect(defSide, attacker.color, t.kind);
        arena.classList.add("shake");
        if(t.isSpecial){
          const fl = document.getElementById("arenaFlash");
          fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
        }
        document.getElementById("hpFillL").style.width = Math.max(0, t.guardHpA/maxA*100)+"%";
        document.getElementById("hpFillR").style.width = Math.max(0, t.guardHpB/maxB*100)+"%";
      }

      setTimeout(()=>{
        document.getElementById("fighter"+defSide).classList.remove("shakehit");
        document.getElementById("sprite"+defSide).classList.remove("flash","special-glow");
        arena.classList.remove("shake");
      }, 600);
    }, 400);

    setTimeout(()=>{
      document.getElementById("fighter"+attSide).classList.remove("lunge-l","lunge-r");
    }, 900);

    i++;
    setTimeout(step, t.isSpecial ? 2200 : 1700);
  }
  step();
}



/* ---------- フェーズ切り替え ---------- */
function showPhase(name){
  ["reception","battle","result"].forEach(p=>{
    const el = document.getElementById("phase" + p.charAt(0).toUpperCase() + p.slice(1));
    el.classList.toggle("hidden", p !== name);
  });
}

/* ---------- 受付キュー・王者システム ---------- */
let queue = [];
let champion = null; // { monster, streak }
let battleInProgress = false;
let resultReturnTimer = null;

const STATE_KEY = "reception_state_v1";
function saveState(){
  try{ localStorage.setItem(STATE_KEY, JSON.stringify({ queue, champion })); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STATE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      queue = Array.isArray(d.queue) ? d.queue : [];
      champion = d.champion || null;
    }
  }catch(e){}
}

function renderQueue(){
  const list = document.getElementById("queueList");
  document.getElementById("queueCount").textContent = queue.length;
  if(queue.length === 0){
    list.innerHTML = `<div class="queue-empty">挑戦者はまだいません。<br>バーコードを入力して登録してください。</div>`;
    return;
  }
  list.innerHTML = "";
  queue.forEach((m, idx)=>{
    const el = document.createElement("div");
    el.className = "queue-item";
    el.innerHTML = `
      <div class="qi-badge" style="background:${m.color}">${m.element}</div>
      <div class="qi-name">${idx+1}. ${m.name}</div>
      <div class="qi-pwr">${m.total}</div>
    `;
    list.appendChild(el);
  });
}

function updateChampionBanner(){
  const el = document.getElementById("championBanner");
  if(champion){
    el.innerHTML = `👑 王者: <b>${champion.monster.name}</b>（${champion.streak}連勝）`;
    el.classList.add("has-champion");
  } else {
    el.textContent = "王者不在 ・ 最初の2体で王座決定戦";
    el.classList.remove("has-champion");
  }
}

function updateNextBattleButton(){
  const btn = document.getElementById("nextBattleBtn");
  const needed = champion ? 1 : 2;
  btn.disabled = battleInProgress || queue.length < needed;
  btn.textContent = champion ? "⚔ 次の挑戦者と対戦" : "⚔ 王座決定戦を開始（2体必要）";
}

async function enqueueBarcode(rawValue){
  const msg = document.getElementById("receptionMsg");
  const digits = (rawValue || "").replace(/\D/g,"");
  if(digits.length < 6){
    msg.textContent = "6桁以上の数字を入力してください";
    msg.style.color = "var(--magenta)";
    return;
  }
  msg.textContent = "読み込み中...";
  msg.style.color = "var(--muted)";

  const monster = digits.startsWith("490000")
    ? await loadOriginalMonster(digits)
    : generateRandomMixMonster(digits);

  queue.push(monster);
  renderQueue();
  updateNextBattleButton();
  saveState();

  msg.textContent = `「${monster.name}」を挑戦者として登録しました`;
  msg.style.color = "var(--green)";

  const input = document.getElementById("barcodeInput");
  input.value = "";
  renderBars("");
  input.focus();
}

function startNextBattle(){
  if(battleInProgress) return;
  let fighterA, fighterB;
  const wasChampion = champion;
  if(champion){
    if(queue.length < 1) return;
    fighterA = champion.monster;
    fighterB = queue.shift();
  } else {
    if(queue.length < 2) return;
    fighterA = queue.shift();
    fighterB = queue.shift();
  }

  battleInProgress = true;
  renderQueue();
  saveState();
  showPhase("battle");

  runBattle(fighterA, fighterB, (winner)=>{
    if(wasChampion && winner === wasChampion.monster){
      champion = { monster: winner, streak: wasChampion.streak + 1 };
    } else {
      champion = { monster: winner, streak: 1 };
    }
    battleInProgress = false;
    saveState();
    showResult(winner, champion.streak);
  });
}

function spawnResultBurst(color){
  const host = document.getElementById("resultAmbient");
  host.innerHTML = "";
  for(let i=0;i<44;i++){
    const p = document.createElement("div");
    p.className = "result-particle";
    const angle = Math.random()*Math.PI*2;
    const dist = 100 + Math.random()*260;
    p.style.setProperty("--dx", Math.cos(angle)*dist+"px");
    p.style.setProperty("--dy", Math.sin(angle)*dist+"px");
    p.style.background = Math.random() < 0.5 ? color : "#FFC247";
    p.style.animationDelay = (Math.random()*0.35)+"s";
    host.appendChild(p);
  }
}

function showResult(winner, streak){
  showPhase("result");

  const frame = document.getElementById("resultCanvasFrame");
  frame.className = "result-canvas-frame" + (winner.rarityKey === "SS" ? " ss" : "");
  frame.style.setProperty("--rc", winner.rarityColor);

  const badge = document.getElementById("resultBadge");
  badge.textContent = `${winner.element} ・ ${winner.rarityLabel}`;
  badge.style.setProperty("--rc", winner.rarityColor);

  document.getElementById("resultName").textContent = winner.name;
  document.getElementById("resultStreak").textContent =
    streak > 1 ? `👑 ${streak}連勝中！` : "🏆 新王者誕生！";

  renderColorGrid(document.getElementById("resultCanvas"), winner.grid, 360);
  spawnResultBurst(winner.color);

  let secondsLeft = 6;
  const cd = document.getElementById("resultCountdown");
  cd.textContent = `${secondsLeft}秒後に受付へ戻ります...`;
  if(resultReturnTimer) clearInterval(resultReturnTimer);
  resultReturnTimer = setInterval(()=>{
    secondsLeft--;
    if(secondsLeft <= 0){
      clearInterval(resultReturnTimer);
      resultReturnTimer = null;
      returnToReception();
    } else {
      cd.textContent = `${secondsLeft}秒後に受付へ戻ります...`;
    }
  }, 1000);
}

function returnToReception(){
  showPhase("reception");
  updateChampionBanner();
  renderQueue();
  updateNextBattleButton();
  const input = document.getElementById("barcodeInput");
  input.value = "";
  renderBars("");
  input.focus();
}

function resetAll(){
  if(!confirm("王者とキューをすべてリセットしますか？")) return;
  queue = [];
  champion = null;
  battleInProgress = false;
  if(resultReturnTimer){ clearInterval(resultReturnTimer); resultReturnTimer = null; }
  renderQueue();
  updateChampionBanner();
  updateNextBattleButton();
  saveState();
  ["L","R"].forEach(side=>{
    document.getElementById("fname"+side).textContent = "-";
    const canvas = document.getElementById("pg"+side);
    const ctx = canvas.getContext("2d");
    if(ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.getElementById("hpFill"+side).style.width = "0%";
    ["resultL","resultR"].forEach(id=>{
      const el = document.getElementById(id);
      el.className = "result-label";
      el.textContent = "";
    });
  });
  document.getElementById("battleLog").classList.add("hidden");
  document.getElementById("battleLog").innerHTML = "";
  showPhase("reception");
}

/* ---------- バーコードバー(装飾) ---------- */
function renderBars(str){
  const box = document.getElementById("barsPreview");
  box.innerHTML = "";
  const digits = (str || "00000000").split("");
  digits.slice(0,10).forEach(d=>{
    const s = document.createElement("span");
    s.style.height = (8 + (parseInt(d,10)||0)*2) + "px";
    box.appendChild(s);
  });
}
renderBars("");
document.getElementById("barcodeInput").addEventListener("input", e=>{
  renderBars(e.target.value);
});
document.getElementById("barcodeInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") enqueueBarcode(e.target.value);
});
document.getElementById("enqueueBtn").addEventListener("click", ()=>{
  enqueueBarcode(document.getElementById("barcodeInput").value);
});
document.getElementById("nextBattleBtn").addEventListener("click", startNextBattle);
document.getElementById("resetBtn").addEventListener("click", resetAll);

/* ---------- init ---------- */
(function init(){
  loadState();
  showPhase("reception");
  renderQueue();
  updateChampionBanner();
  updateNextBattleButton();
  loadPartPool();
  document.getElementById("barcodeInput").focus();
})();

</script>
</body>
</html>
